:"...d5 - the other good answer",p:"If you would rather keep it simple, ...d5 also equalises comfortably."},13:{n:"2.b3 with ...d5, main line",p:"Your queen came out early but with tempo, and you have a big centre. ...Bb4 pins and you are fine."}}},{b:"b",mv:"c2c4 g8f6 g2g3 e7e6 f1g2 d7d5",san:"c4 Nf6 g3 e6 Bg2 d5",tag:{2:{n:"English, fianchetto",p:"He'll aim for a Catalan-style squeeze."},5:{n:"English fianchetto, main setup",p:"...Be7, castle, ...c5. Same structures you already know."}}},{b:"b",mv:"c2c4 g8f6 g1f3 e7e6 g2g3 d7d5",san:"c4 Nf6 Nf3 e6 g3 d5",tag:{2:{n:"English, 2.Nf3",p:"Flexible move order, same destination."},5:{n:"English 2.Nf3, main setup",p:"Once d4 appears this is a Catalan or Queen's Gambit. Play your normal setup."}}},{b:"b",mv:"g1f3 g8f6 b1c3 d7d5 d2d4 c7c5 d4c5 b8c6 e2e3 e7e6 f1b5 f8c5",san:"Nf3 Nf6 Nc3 d5 d4 c5 dxc5 Nc6 e3 e6 Bb5 Bxc5",tag:{2:{n:"R\xE9ti: 2.Nc3",p:"Knights before pawns. It usually turns into a Queen's Pawn game or the Rapport-Jobava you already know."},3:{n:"...d5 - take the centre",t:"main",p:"Engine's first choice. He has not staked a claim in the middle, so you do it first."},5:{n:"...c5! - hit d4 at once",t:"main",p:"The move that keeps you comfortable. Do not settle for a passive setup here - challenge the pawn before he supports it with e3 and Bd3."},11:{n:"2.Nc3, main line",p:"You recover the pawn with ...Bxc5 and have equal development, the better centre and no weaknesses. If he plays Bf4 at any point this transposes straight into your Jobava London answer."}}},{b:"b",mv:"g1f3 g8f6 c2c4 e7e6 b1c3 d7d5 d2d4 c7c5",san:"Nf3 Nf6 c4 e6 Nc3 d5 d4 c5",tag:{0:{n:"R\xE9ti / Zukertort Opening",p:"He starts with the knight and keeps his options open. Most of these move orders end up back in normal positions \u2014 your job is to steer them there."},1:{n:"...Nf6 \u2014 the flexible reply",t:"main",p:"Same first move you play against 1.d4, and for the same reason: it commits to nothing and it fits every transposition."},3:{p:"...e6, exactly as in your d4 book. You are now one move from familiar ground."},7:{n:"R\xE9ti, transposed",p:"d4 and c4 are both on the board, so this IS your Queen's Gambit / Nimzo territory arriving by a different door. If he plays Nc3 you have ...Bb4; if Nf3 and g3, treat it as a Catalan."}}},{b:"b",mv:"c2c4 g8f6 b1c3 e7e6 d2d4 f8b4",san:"c4 Nf6 Nc3 e6 d4 Bb4",tag:{0:{n:"English Opening",p:"A flank opening. Below 1500 it usually transposes into a Queen's Pawn position within a few moves."},1:{n:"...Nf6 again",t:"main",p:"One reply covers 1.d4, 1.Nf3 and 1.c4. That is the whole point of building the repertoire around ...Nf6 and ...e6."},5:{n:"Nimzo-Indian, transposed",p:"The moment d4 appears alongside Nc3, your Nimzo is on. Identical position, different move order \u2014 nothing new to learn."}}},{b:"b",mv:"g1f3 d7d5 g2g4 c8g4 f3e5 g4f5 d2d4 f7f6",san:"Nf3 d5 g4 Bxg4 Ne5 Bf5 d4 f6",tag:{2:{n:"Early flank thrust",t:"trap",p:"A wing pawn thrown forward before anything is developed. It looks alarming and it is simply bad."},3:{n:"...Bxg4! \u2014 take it",t:"main",p:"The principle for every early flank push: take what's offered, then answer play on the wing with play in the centre. Declining out of nerves is how these gimmicks earn their reputation."},7:{n:"Flank thrust refuted",p:"You're a pawn up with the whole centre. Kick the knight, finish developing, castle. Nothing clever required \u2014 he has spent his opening on the edge of the board."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 e2e3 b7b6 f1d3 c8b7 e1g1 f8e7 c2c4 e8g8 b1c3 d7d5 c4d5 e6d5 b2b3 b8d7 c1b2 f6e4",san:"d4 Nf6 Nf3 e6 e3 b6 Bd3 Bb7 O-O Be7 c4 O-O Nc3 d5 cxd5 exd5 b3 Nbd7 Bb2 Ne4",tag:{4:{n:"Yusupov-Rubinstein System",p:"1.d4 Nf6 2.Nf3 e6 3.e3. Quiet and flexible - he keeps c4 in reserve and can steer into a Colle, a Queen's Gambit or a Torre depending on what you do."},5:{n:"...b6 - the main line",t:"main",p:"The book answer, and it fits your repertoire exactly: this is your Queen's Indian setup arriving one move early. ...Bb7, ...Be7, castle."},13:{n:"...d5 - the freeing break",p:"Once he commits c4 and Nc3, hit the centre. Trading on d5 gives you a clean symmetrical structure with easy piece play."},19:{n:"Yusupov-Rubinstein, main tabiya",p:"...Ne4 is the point: the outpost cannot be driven off by a pawn and it blocks his b2 bishop. Then ...Bf6 or ...Bd6 and you are fully equal with an easy plan."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 e2e3 c7c5 c2c4 c5d4 e3d4 d7d5 b1c3 f8e7 f1d3 e8g8 e1g1 b8c6",san:"d4 Nf6 Nf3 e6 e3 c5 c4 cxd4 exd4 d5 Nc3 Be7 Bd3 O-O O-O Nc6",tag:{5:{n:"...c5 - the direct answer",p:"The other treatment: strike at d4 at once. Simpler than ...b6 and it usually gives him an isolated d-pawn."},15:{n:"Isolated pawn structure",p:"He has an isolated pawn on d4. Blockade the d5 square with a knight, trade pieces, and the pawn becomes a permanent weakness in the endgame. Do not let him get a free kingside attack in return - castle early."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 b7b6 g2g3 c8b7 f1g2 f8e7 e1g1 e8g8 b1c3 f6e4 d1c2 e4c3 c2c3 f7f5",san:"d4 Nf6 c4 e6 Nf3 b6 g3 Bb7 Bg2 Be7 O-O O-O Nc3 Ne4 Qc2 Nxc3 Qxc3 f5",tag:{4:{n:"Anti-Nimzo: 3.Nf3",t:"main",p:"This is what 'anti-Nimzo' means. By playing Nf3 before Nc3, he denies you ...Bb4 - there is no knight on c3 to pin. Your Nimzo simply cannot appear."},5:{n:"...b6 - Queen's Indian",t:"main",p:"The standard answer, and already your repertoire. If he will not give you the pin, take the long diagonal instead."},13:{n:"...Ne4 - the key square",p:"The knight on e4 is the whole idea of the Queen's Indian: supported by the b7 bishop and impossible to kick with a pawn."},17:{n:"Queen's Indian, main tabiya",p:"...f5 locks the knight's replacement square and gives you a solid grip. Fully equal, easy to play, and the structures repeat."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 f8b4 c1d2 d8e7 g2g3 e8g8 f1g2 b4d2 b1d2 d7d6 e1g1 b8d7 e2e4 e6e5",san:"d4 Nf6 c4 e6 Nf3 Bb4+ Bd2 Qe7 g3 O-O Bg2 Bxd2+ Nbxd2 d6 O-O Nbd7 e4 e5",tag:{5:{n:"Bogo-Indian Defence",t:"main",p:"The other answer to 3.Nf3, and the one to consider if you want less theory. You keep the bishop check anyway - he just has to block with the bishop or the knight instead of the c3 knight."},6:{n:"Bd2 - the main block",p:"He blocks with the bishop, offering a trade."},17:{n:"Bogo-Indian, main tabiya",p:"You trade the bishop off, play ...d6 and ...e5, and get a solid King's-Indian-lite position. Far less to memorise than the Queen's Indian and it fits the same move order."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 b7b6 a2a3 c8b7 b1c3 d7d5 c4d5 f6d5 d1c2 f8e7 e2e4 d5c3 b2c3 e8g8",san:"d4 Nf6 c4 e6 Nf3 b6 a3 Bb7 Nc3 d5 cxd5 Nxd5 Qc2 Be7 e4 Nxc3 bxc3 O-O",tag:{6:{n:"Queen's Indian: Petrosian Variation",p:"a3 stops ...Bb4 permanently and prepares Nc3 without allowing the pin."},17:{n:"Petrosian Variation, main tabiya",p:"Trade on c3 to give him doubled pawns, then castle and play against them. His extra centre is balanced by your better structure."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 b7b6 e2e3 c8b7 f1d3 d7d5 e1g1 f8e7 b2b3 e8g8 c1b2 b8d7",san:"d4 Nf6 c4 e6 Nf3 b6 e3 Bb7 Bd3 d5 O-O Be7 b3 O-O Bb2 Nbd7",tag:{6:{n:"Queen's Indian: 4.e3",p:"A quiet, Colle-like setup - the same shape as the Yusupov-Rubinstein."},15:{n:"4.e3, main tabiya",p:"...d5 and ...Nbd7 and you are completely comfortable. He has no pressure and you can play ...c5 or ...Ne4 when you choose."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 f8b4 b1d2 b7b6 a2a3 b4d2 c1d2 c8b7 d2g5 h7h6 g5f6 d8f6",san:"d4 Nf6 c4 e6 Nf3 Bb4+ Nbd2 b6 a3 Bxd2+ Bxd2 Bb7 Bg5 h6 Bxf6 Qxf6",tag:{6:{n:"Bogo-Indian: Nbd2 block",p:"He blocks with the knight instead, keeping his bishop free."},15:{n:"Nbd2 line, main tabiya",p:"Trade the bishop for the knight and you have the bishop pair after Bxf6. Equal or slightly better for you - the engine calls it -0.18."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 e2e3 e8g8 f1d3 c7c5",san:"d4 Nf6 c4 e6 Nc3 Bb4 e3 O-O Bd3 c5",tag:{1:{p:"Always. Then ...e6. White's third move decides which of your three openings appears."},5:{n:"Nimzo-Indian Defence",t:"main",p:"Your main study. The pin is everything \u2014 trade for the knight to wreck his pawns, or keep the tension."},6:{n:"Rubinstein Variation",p:"The practical main line. Most of your Nimzo games arrive here."},9:{p:"Hit d4. Don't let him build the centre unchallenged."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 d1c2 e8g8",san:"d4 Nf6 c4 e6 Nc3 Bb4 Qc2 O-O",tag:{6:{n:"Classical Variation",p:"He avoids the doubled pawns. You play ...d5 or ...c5 and fight for e4."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 a2a3 b4c3 b2c3 c7c5",san:"d4 Nf6 c4 e6 Nc3 Bb4 a3 Bxc3+ bxc3 c5",tag:{6:{n:"S\xE4misch Variation",p:"He forces the trade."},9:{p:"He has the bishop pair, you have the better structure. Blockade on c4 and play against those doubled pawns."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g1f3 b7b6 g2g3 c8b7 f1g2 f8e7",san:"d4 Nf6 c4 e6 Nf3 b6 g3 Bb7 Bg2 Be7",tag:{5:{n:"Queen's Indian Defence",p:"No Nc3 means no Nimzo. Take the long diagonal instead \u2014 the b7 bishop fights for e4."},9:{p:"Then castle and choose ...d5 or ...Ne4. Solid and very hard to break down."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 g2g3 d7d5 f1g2 f8e7",san:"d4 Nf6 c4 e6 g3 d5 Bg2 Be7",tag:{5:{n:"Catalan Opening",p:"His fianchettoed bishop is the problem piece. Either take on c4 and hold it with ...a6/...b5, or stay solid with ...c6."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 c2c4 b7b6",san:"d4 Nf6 Nf3 e6 c4 b6",tag:{5:{n:"Queen's Indian (delayed)",p:"Transposes straight back into your repertoire. Or ...Bb4+ for the Bogo-Indian if you want less theory."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 b1c3 f8b4 a2a3 b4c3 b2c3 c7c5",san:"d4 Nf6 Nf3 e6 Nc3 Bb4 a3 Bxc3+ bxc3 c5",tag:{4:{n:"Queen's Pawn: 3.Nc3 (no c4)",p:"Nc3 without c4. It LOOKS like your Nimzo but it isn't \u2014 there's no c4 pawn for the pin to work against."},5:{p:"...Bb4 is still good. Just know what it's worth here."},7:{n:"Bxc3+! \u2014 take when kicked",t:"main",p:"Without c4 the bishop has no long-term target, so when a3 asks the question, answer it \u2014 taking is dead equal. Retreating to a5 invites b4 with tempo and then Nb5, and the bishop burns moves while he develops."},9:{n:"3.Nc3, main setup",p:"He has doubled c-pawns, you have a clean structure. Then ...d5, ...O-O, ...Nc6 and press the c4 square."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 b1c3 d7d5 c1f4 f8b4 d1d3 f6e4 f3d2 e4c3 b2c3 b4d6 f4d6 c7d6 d3b5",san:"d4 Nf6 Nf3 e6 Nc3 d5 Bf4 Bb4 Qd3 Ne4 Nd2 Nxc3 bxc3 Bd6 Bxd6 cxd6 Qb5+",tag:{6:{n:"Queen's Pawn: 4.Bf4",p:"Nc3 and Bf4 \u2014 the Jobava setup reached by a different move order. Because you have already played ...e6, his Nb5 ideas are gone."},7:{n:"...Bb4! \u2014 pin the knight",t:"main",p:"The move to know here, and it works against 4.Bg5 too. Once his dark bishop leaves the pawn chain, c3 is loose and the pin bites. Your ...Nc6 was natural but passive \u2014 it neither pressures him nor prepares a break."},16:{n:"4.Bf4, main line",p:"Trade off his good bishop, take on c3 when it suits you, and you end up better. He has doubled pawns and no attack."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 b1c3 d7d5 c1g5 f8e7 g5f6 e7f6 e2e4 e8g8 d1d2 c7c5 d4c5 d5e4 c3e4",san:"d4 Nf6 Nf3 e6 Nc3 d5 Bg5 Be7 Bxf6 Bxf6 e4 O-O Qd2 c5 dxc5 dxe4 Nxe4",tag:{6:{n:"Queen's Pawn: 4.Bg5",p:"The other bishop sortie. Same family, same treatment."},7:{n:"...Be7 \u2014 break the pin first",t:"main",p:"Here ...Bb4 is playable but ...Be7 is cleaner: it unpins immediately and invites the trade on f6, after which you recapture with the bishop and have no structural damage."},16:{n:"4.Bg5, main line",p:"Bishops come off, you castle, and ...c5 hits the centre. Fully equal with a free game."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 b1c3 d7d5 d1d3 c7c5 e2e4 c5d4 f3d4 e6e5 d4f3 f8b4 c1g5 d5d4 e1c1",san:"d4 Nf6 Nf3 e6 Nc3 d5 Qd3 c5 e4 cxd4 Nxd4 e5 Nf3 Bb4 Bg5 d4 O-O-O",tag:{6:{n:"Queen's Pawn: 4.Qd3",p:"An early queen move supporting e4. It looks odd and it is playable."},7:{n:"...c5! \u2014 hit the centre at once",t:"main",p:"He has spent a move on his queen instead of developing a piece, so strike immediately. Every tempo counts against a queen that has come out early."},16:{n:"4.Qd3, main line",p:"You are slightly better: his queen has moved twice, you have the centre, and ...Bb4 with ...d4 gives you the initiative."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 b1c3 d7d5 e2e3 c7c5",san:"d4 Nf6 Nf3 e6 Nc3 d5 e3 c5",tag:{5:{n:"3.Nc3, ...d5",p:"The simplest answer \u2014 engine's first choice. Take the centre and forget the pin."},7:{n:"3.Nc3, ...d5 setup",p:"Straight into a Queen's Gambit structure you already know: ...d5, ...c5, ...Nc6, ...Bd6. No new ideas needed."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 c1f4 c7c5 e2e3 d8b6",san:"d4 Nf6 Nf3 e6 Bf4 c5 e3 Qb6",tag:{4:{n:"London System",p:"He'll play the same six moves whatever you do \u2014 so you get one setup too."},5:{p:"Challenge d4 immediately. Never sit passively against the London."},7:{n:"London, ...Qb6",p:"Hits b2, which is loose now the bishop has left c1. Players below 1500 drop this pawn constantly."}}},{b:"b",mv:"d2d4 g8f6 c1f4 d7d5 e2e3 e7e6 g1f3 c7c5 c2c3 b8c6 b1d2 f8d6",san:"d4 Nf6 Bf4 d5 e3 e6 Nf3 c5 c3 Nc6 Nbd2 Bd6",tag:{2:{n:"London System",p:"Bishop out early, no c4. The most common thing you'll face below 1500."},11:{n:"London, main setup",p:"The four ideas: ...Bd6 offers to trade his key bishop, ...c5 hits d4, ...Qb6 hits b2, and get ...Bf5 out early if he ever allows it."}}},{b:"b",mv:"d2d4 g8f6 c1g5 e7e6 e2e4 h7h6 g5f6 d8f6",san:"d4 Nf6 Bg5 e6 e4 h6 Bxf6 Qxf6",tag:{2:{n:"Trompowsky Attack",p:"Ask the bishop the question early."},7:{p:"You have the bishop pair and a sound position. Nothing to fear here."}}},{b:"b",mv:"d2d4 g8f6 b1c3 d7d5 c1f4 a7a6 e2e3 b8c6 g1f3 c8g4 h2h3 g4f3 d1f3 e7e6",san:"d4 Nf6 Nc3 d5 Bf4 a6 e3 Nc6 Nf3 Bg4 h3 Bxf3 Qxf3 e6",tag:{9:{n:"...Bg4 \u2014 the pin",p:"Playable, but it commits you. The bishop now has exactly two safe futures and you must pick one on the very next move."},11:{n:"Bxf3 \u2014 take, don't linger",p:"Trading kills the h3-then-g4 plan before it starts. The alternative is ...Bh5, and then when g4 arrives the bishop MUST go to g6 \u2014 the only square that stays safe. Left on h5 it is simply lost."},13:{n:"Equal and simple",p:"You've given the bishop pair but his structure is loose and your position is easy to play: ...Be7, castle, ...Ne7 and ...c5."}}},{b:"b",mv:"d2d4 g8f6 b1c3 d7d5 c1f4 a7a6 e2e3 e7e6 g1f3 c7c5",san:"d4 Nf6 Nc3 d5 Bf4 a6 e3 e6 Nf3 c5",tag:{4:{n:"Jobava London",p:"Different move order, same family."},5:{p:"...a6 stops Nb5 hitting c7 \u2014 that's the entire point of his move order."},7:{p:"Solid and simple. Resist ...Bg4 here \u2014 h3 followed by g4 gains time and can trap the bishop outright."},9:{n:"Jobava, main setup",p:"...e6, ...c5, ...Nc6, ...Bd6 and castle. Challenge d4 and finish developing before you look for anything sharp."}}},{b:"b",mv:"d2d4 g8f6 e2e3 d7d5 c2c4 e7e6 g1f3 c7c5",san:"d4 Nf6 e3 d5 c4 e6 Nf3 c5",tag:{2:{n:"Passive system \u2014 no c4 yet",p:"Treat it exactly like the London: ...d5, ...e6, ...c5."},7:{n:"Your game \u2014 this was correct",p:"It transposed to a Queen's Gambit Declined. You came out of the opening winning; the loss came much later and wasn't preparation."}}},{b:"b",mv:"d2d4 g8f6 e2e4 f6e4 f1d3 e4f6",san:"d4 Nf6 e4 Nxe4 Bd3 Nf6",tag:{2:{n:"Omega Gambit",t:"trap",p:"He throws the e-pawn at you for development."},3:{p:"Take it."},5:{p:"RETREAT. Don't try to hold the knight with ...d5, and never take a second pawn. Then ...d5, ...e6, ...Be7, castle."}}}],$n={commit:{label:"Career line",chip:"COMMITTED",edge:4,hint:"a line you are committing to long term"},main:{label:"Main study",chip:"MAIN STUDY",edge:1,hint:"the key move in this position"},trap:{label:"Memorise",chip:"MEMORISE",edge:1,hint:"get this wrong and the game is over"},plain:{label:"Standard",chip:"",edge:1,hint:"ordinary book move"}},ei=["commit","main","trap","plain"],ti=["very common","common","occasi
