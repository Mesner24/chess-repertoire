t you are never worse."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3 e8g8 h2h3 c6b8 d2d4 b8d7 b1d2 c8b7 b3c2 f8e8 d2f1 e7f8",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Nb8 d4 Nbd7 Nbd2 Bb7 Bc2 Re8 Nf1 Bf8",tag:{17:{n:"Breyer Variation",p:"The knight retreats all the way to b8 to re-route via d7. Ugly and completely sound \u2014 Spassky and Kramnik both used it."},25:{n:"Breyer, main line",p:"Your knight goes d2-f1-g3, his goes b8-d7. Both sides manoeuvre. Keep the tension and don't rush d5."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3 e8g8 h2h3 c6a5 b3c2 c7c5 d2d4 d8c7 b1d2 a5c6 d4d5",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Na5 Bc2 c5 d4 Qc7 Nbd2 Nc6 d5",tag:{16:{n:"Ruy Lopez, Closed: 9.h3",p:"The main tabiya of the whole opening. h3 stops ...Bg4 before you commit to d4. Black now chooses where his queen's knight goes, and that choice names the variation."},17:{n:"Chigorin Variation",t:"main",p:"The classical plan: the knight goes to a5 to hit your bishop, then ...c5 and ...Qc7. Most common at club level."},24:{n:"Chigorin, main line",p:"You push d5 and lock the centre. Then Nf1-g3 or a4 on the queenside. Slow, strategic, and your space edge lasts all game."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3 e8g8 h2h3 f6d7 d2d4 e7f6 a2a4 c8b7 c1e3 e5d4",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Nd7 d4 Bf6 a4 Bb7 Be3 exd4",tag:{17:{n:"Karpov Variation",p:"...Nd7 supports e5 and prepares ...Bf6 to hit d4."},23:{n:"Karpov, main line",p:"He trades on d4 to relieve the cramp. Recapture with the pawn and keep the centre."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 e8g8 c2c3 d7d5 e4d5 f6d5 f3e5 c6e5 e1e5 c7c6 d2d4 e7d6 e5e1 d8h4 g2g3 h4h3",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O c3 d5 exd5 Nxd5 Nxe5 Nxe5 Rxe5 c6 d4 Bd6 Re1 Qh4 g3 Qh3",tag:{13:{n:"Marshall move order",t:"main",p:"This is the moment. He castles instead of ...d6, and that means the Marshall Attack is coming. Decide now whether to allow it."},15:{n:"MARSHALL ATTACK",t:"trap",p:"He sacrifices a pawn for a long-term attack. Completely sound and analysed to move 30 by grandmasters \u2014 if you don't know it, avoid it."},27:{n:"Marshall, main line",p:"His queen lands on h3 and you must find g3 and Re4 accurately. Playable but you are defending for twenty moves. If that isn't your idea of fun, use the anti-Marshall."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f6e4 d2d4 b7b5 a4b3 d7d5 d4e5 c8e6 c2c3 f8c5 b1d2 e8g8 b3c2 e6f5",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 b5 Bb3 d5 dxe5 Be6 c3 Bc5 Nbd2 O-O Bc2 Bf5",tag:{9:{n:"Open Defence: main line",p:"He keeps the pawn and accepts a loose knight on e4."},21:{n:"Open Defence, main tabiya",p:"His pieces are active but that knight has no permanent home. Play Nb3 or Qe2 next and chip at it. Sharpest line you'll meet in the Spanish."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3 e8g8 h2h3 h7h6 d2d4 f8e8 b1d2 e7f8 b3c2 g7g6 b2b3 f8g7",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 h6 d4 Re8 Nbd2 Bf8 Bc2 g6 b3 Bg7",tag:{17:{n:"Smyslov Variation",p:"...h6 first, keeping every option open."},25:{n:"Smyslov, main line",p:"He fianchettoes and you build with b3 and Bb2. A quiet manoeuvring game where your extra space decides it."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3 e8g8 h2h3 c8b7 d2d4 f8e8 b1d2 e7f8 a2a4 h7h6 b3c2 e5d4 c3d4 c6b4",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Bb7 d4 Re8 Nbd2 Bf8 a4 h6 Bc2 exd4 cxd4 Nb4",tag:{17:{n:"Zaitsev Variation",p:"...Bb7 and ...Re8, Karpov's weapon. He pressures e4 directly."},27:{n:"Zaitsev, main line",p:"He trades on d4 and jumps to b4 to hit your bishop. Meet it with Bb1 and you keep a pleasant space edge."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6 c2c3",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3",tag:{0:{n:"King's Pawn Opening",p:"Your move one, always. The core: Nf3 then Bb5 answers Black's two most common replies."},4:{n:"Ruy Lopez",t:"main",p:"Your main study. Plan: 0-0, Re1, c3, d4. When he kicks with ...a6 and ...b5, retreat Ba4 then Bb3."},14:{n:"Ruy Lopez, Closed",p:"The main position. d4 comes next. Don't chase the e5 pawn \u2014 it isn't going anywhere."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 b7b5 a4b3 g8f6 e1g1 f8e7 d2d4 d7d6",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 b5 Bb3 Nf6 O-O Be7 d4 d6",tag:{7:{n:"Ruy Lopez: 4...b5",p:"He kicks the bishop immediately. Your bishop is attacked and MUST move \u2014 and only one square is right."},8:{n:"Bb3 \u2014 the only move",t:"main",p:"b3 keeps the bishop on the a2-g8 diagonal, still eyeing f7. Anything else (Bc2, Bd1) is safe but passive, and NEVER 5.Nxe5 or 5.d4 \u2014 ...bxa4 just wins the bishop."},13:{n:"Ruy Lopez, 4...b5 Main Line",p:"Remember the standing idea in every ...b5 line: a4! His b-pawn is a target and a4 opens the file against it. If ...b4 then c3; if ...bxa4 then Rxa4 or Bxa4 with pressure on the open file."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 b7b5 a4b3 c6a5 e1g1 d7d6 d2d4",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 b5 Bb3 Na5 O-O d6 d4",tag:{9:{n:"Ruy Lopez: Taimanov Variation",p:"Also called the Chase or Wing Variation. He wants to trade off your good bishop with ...Nxb3."},12:{n:"Taimanov, 7.d4",p:"Castle first, then hit the centre. Let him spend two moves trading a knight for your bishop \u2014 you get the centre and a lead in development while he does it."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 b7b5 a4b3 f8c5 c2c3 g8f6 a2a4",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 b5 Bb3 Bc5 c3 Nf6 a4",tag:{9:{n:"Ruy Lopez: Graz Variation",p:"Active but the bishop on c5 will be hit by d4."},12:{n:"Graz, a4!",p:"There it is again \u2014 a4 against the b5 pawn. This is the single idea that makes every ...b5 line work for you."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 b7b5 a4b3 c8b7 e1g1 g8f6 d2d3",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 b5 Bb3 Bb7 O-O Nf6 d3",tag:{9:{n:"Ruy Lopez, 4...b5 with ...Bb7",p:"He fianchettoes to pressure e4."},12:{n:"Caro, quiet d3",p:"d3 holds e4 comfortably. Then Nc3 heading for d5, or a4 as usual. No need for anything sharp."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 d7d5 e4d5 f6d5 f3e5",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O d5 exd5 Nxd5 Nxe5",tag:{9:{p:"A mistake \u2014 he opens the centre while behind in development. You saw this and punished it."},10:{p:"exd5 is best. Take, and let him spend another move recapturing."},12:{n:"Ruy Lopez, 5...d5 punished",t:"main",p:"Nxe5! wins the pawn back with interest. His king can't get out and Re1 with Nxc6 ideas are coming. The general rule: when someone opens the centre before castling, open it further."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f6e4 d2d4 e5d4 f1e1 f7f5 f3d4 d8h4 g2g3 h4f6 a4c6 d7c6",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 exd4 Re1 f5 Nxd4 Qh4 g3 Qf6 Bxc6 dxc6",tag:{11:{n:"Ruy Lopez: Riga Variation",t:"trap",p:"Instead of the normal 6...b5 he takes on d4, giving back the piece for an open game. Sharp, and it catches people who expect the routine Open Defence."},12:{n:"Re1! - pin before you recapture",t:"main",p:"Do NOT hurry to take on d4. Re1 pins the knight on e4 against his king on e8, and the pawn on d4 is not running away. Recapture on the next move once the pin has done its work. This is the same idea as the Berlin punishment: an open e-file with his king still on it beats a pawn every time."},19:{n:"Riga, main line",p:"You are +1.5. He has doubled c-pawns and a wandering queen; you have the two bishops gone but a clean structure and the initiative. Nf3 or Be3 next, then double on the e-file."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f6e4 d2d4 b7b5 a4b3 d7d5",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 b5 Bb3 d5",tag:{9:{n:"Ruy Lopez: Open Defence",p:"Black's sharpest try and objectively his best. He grabs the pawn and accepts a loose knight on e4."},10:{p:"d4! \u2014 don't chase the knight, open the centre against it."},13:{n:"Open Defence, Main Line",p:"The standard tabiya. Next: Be3 or c3, then Nbd2 to challenge that e4 knight. His knight looks strong but has no support."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 d7d6 d1e2 f7f5 d4d5 c8d7 d5c6 b7c6",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 d6 Qe2 f5 d5 Bd7 dxc6 bxc6",tag:{9:{n:"Berlin: 5...d6",p:"A mistake. He props up the knight on e4 but leaves his king on the open e-file with nothing developed."},10:{n:"Qe2! - pin down the e-file",t:"main",p:"The cleanest punishment. The queen lines up against his king through the knight on e4, so the knight is pinned and cannot move. d5 also works and is what you played - almost identical value - but Qe2 is the idea worth keeping: when his king sits on an open file, put the queen or rook there before anything else."},15:{n:"Berlin 5...d6, main line",p:"You win the pawn back with the better structure and a lead in development. No tactics needed from here - just develop and open the centre."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 a7a6 b5c6 d7c6 d1e2 e4d6 d4e5",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 a6 Bxc6 dxc6 Qe2 Nd6 dxe5",tag:{9:{n:"Berlin: 5...a6",p:"Kicking the bishop first. Sound, and the second most common try."},14:{n:"Berlin 5...a6, main line",p:"Trade on c6 and take on e5. He has the bishop pair, you have the better structure and the safer king - the same trade-off as the Berlin Wall itself."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 e5d4 f1e1 f7f5 f3d4 c6d4 d1d4 c7c6 b5d3",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 exd4 Re1 f5 Nxd4 Nxd4 Qxd4 c6 Bd3",tag:{9:{n:"Berlin: Rio Gambit Accepted, 5...exd4",p:"He grabs on d4 instead of retreating the knight. A small error \\u2014 you are +0.8 if you answer it properly."},10:{n:"Re1! \\u2014 pin before you recapture",t:"main",p:"The same idea as the Riga: his king is still on e8, his knight on e4 is in the way, and the pawn on d4 cannot run. Take the file first and recapture next move. The natural 6.Nxd4 throws the whole edge away \\u2014 engine has it at \\u22120.2, because it releases the pin and lets him consolidate with ...Be7 and castling."},12:{n:"Nxd4 \\u2014 now it works",p:"With the rook on e1 and his knight pinned, the recapture comes with the initiative rather than without it."},16:{n:"5...exd4, main line",p:"Bd3 hits the pinned knight a third time. He has to give it back or lose castling rights. Comfortable edge with no tactics required."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 f8e7 d1e2 e4d6 b5c6 b7c6 d4e5 d6b7 b1c3 e8g8",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Be7 Qe2 Nd6 Bxc6 bxc6 dxe5 Nb7 Nc3 O-O",tag:{9:{n:"Berlin: Rio de Janeiro Variation",p:"The main alternative to 5...Nd6, and objectively his best practical try after 4...Nxe4."},10:{n:"Qe2 \\u2014 pile on the e-file",t:"main",p:"Line the queen up behind his knight. Same principle as everywhere in this variation: the e-file is the story, not the pawn."},17:{n:"Rio de Janeiro, main line",p:"Queens stay on, he has doubled c-pawns and a knight buried on b7. You are +0.4 with a clear plan: Re1, Bf4, and press the queenside majority."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 e4d6 b5c6 d7c6 d4e5",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5",tag:{5:{n:"Ruy Lopez: Berlin Defence",p:"Kramnik's drawing weapon against Kasparov. Solid to a fault \u2014 Black wants an endgame, not a game."},12:{n:"Berlin Wall",p:"Queens come off next and Black loses castling rights but gets the bishop pair. You have the better structure and a healthy kingside majority \u2014 play Rd1, Nc3, Bf4 and squeeze."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 f8c5 c2c3 g8f6 d2d4",san:"e4 e5 Nf3 Nc6 Bb5 Bc5 c3 Nf6 d4",tag:{5:{n:"Ruy Lopez: Classical Defence",p:"Natural but slightly loose \u2014 the bishop on c5 will be hit by d4."},8:{n:"Classical Defence, 5.d4",p:"Build the centre with tempo against the bishop. You get a comfortable space edge."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 e5d4 e4e5 f6e4 d1d4 d7d5 e5d6 e4d6 b1c3 b8c6 d4f4 g7g6 c1d2 f8g7",san:"e4 e5 Nf3 Nf6 d4 exd4 e5 Ne4 Qxd4 d5 exd6 Nxd6 Nc3 Nc6 Qf4 g6 Bd2 Bg7",tag:{5:{n:"Petroff: 3...exd4",p:"The most natural reply and one of the two main lines. He takes and asks you to prove the pawn was worth something."},6:{n:"e5! \u2014 push, don't recapture",t:"main",p:"This is the move the book was missing. Do NOT hurry to take back on d4: the pawn is not running, and e5 hits the knight with tempo while it has nowhere good to go. Recapturing at once with 4.Nxd4 is what you played and it lets him equalise on the spot with ...Nxe4."},8:{n:"Qxd4 \u2014 now take it",p:"With his knight stuck on e4 and no development, the pawn comes back for free."},17:{n:"3...exd4, main line",p:"You have a lead in development and the better structure. Castle long or short, put a rook on e1 or d1, and his knight on d6 remains awkward all game."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 f8e7 d4e5 f6e4 f1c4 e8g8 e1g1 d7d6 f1e1 e4c5 e5d6 d8d6",san:"e4 e5 Nf3 Nf6 d4 Be7 dxe5 Nxe4 Bc4 O-O O-O d6 Re1 Nc5 exd6 Qxd6",tag:{5:{n:"Petroff: 3...Be7",p:"Quiet and solid \u2014 he declines the whole argument."},6:{n:"dxe5 \u2014 take while he's slow",t:"main",p:"He has spent a move on a modest bishop move, so open the position. His knight has to go to e4 where you gain time on it."},15:{n:"3...Be7, main line",p:"You are +0.7 with easy play: Re1, Nc3, Bf4. His pieces are passive and he has no break."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 d7d5 e4d5 e5d4 f1b5 c7c6 d5c6 b7c6 b5e2 f8d6 e1g1 e8g8",san:"e4 e5 Nf3 Nf6 d4 d5 exd5 exd4 Bb5+ c6 dxc6 bxc6 Be2 Bd6 O-O O-O",tag:{5:{n:"Petroff: 3...d5",p:"The sharpest try \u2014 he counter-strikes in the centre rather than resolving the tension."},6:{n:"exd5 then Bb5+!",t:"main",p:"Take, and when he recaptures on d4 the check on b5 is the point. It wins a tempo and wrecks his queenside structure after ...c6 and dxc6."},15:{n:"3...d5, main line",p:"You are +1.1: he has doubled c-pawns and you have a clean structure with the bishop pair traded off. Castle and press on the c-file."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 f6e4 f1d3",san:"e4 e5 Nf3 Nf6 d4 Nxe4 Bd3",tag:{4:{n:"Petroff Defence",p:"Simpler than 3.Nxe5. Open the centre, develop, take the small space edge."},6:{p:"Develop and hit the knight. Don't panic about the pawn."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 g8f6 b1c3 b8d7 f1c4 f8e7 a2a4 c7c6 e1g1 e8g8",san:"e4 e5 Nf3 d6 d4 Nf6 Nc3 Nbd7 Bc4 Be7 a4 c6 O-O O-O",tag:{5:{n:"Philidor, 3...Nf6",t:"main",p:"The most common and the best. He holds e5 with pieces instead of committing a pawn."},6:{n:"Nc3 - develop, don't resolve",p:"Don't rush dxe5 or d5. Keep the tension: your centre is bigger, so make him solve the problem."},13:{n:"Philidor, Nf6 main tabiya",p:"A small permanent space edge. Re1, Bb3, h3, then build slowly. He is solid but passive and there is no rush."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 e5d4 f3d4 g8f6 b1c3 f8e7 c1f4 c7c6 d1d2 e8g8",san:"e4 e5 Nf3 d6 d4 exd4 Nxd4 Nf6 Nc3 Be7 Bf4 c6 Qd2 O-O",tag:{5:{n:"Philidor Exchange",p:"He releases the tension himself, which suits you - you recapture with a piece and get free development."},13:{n:"Philidor Exchange, main tabiya",p:"Bf4, Qd2, then castle either side. His d6 pawn is backward on an open file: that is the long-term target."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 b8c6 d4d5 c6e7 c2c4 g7g6 c4c5 f8g7 c5d6 c7d6",san:"e4 e5 Nf3 d6 d4 Nc6 d5 Nce7 c4 g6 c5 Bg7 cxd6 cxd6",tag:{5:{n:"Philidor, 3...Nc6",p:"Natural but poor - the knight blocks his own c-pawn and has no square once you push."},6:{n:"d5! - push and gain",t:"main",p:"Kick the knight to the rim. The pawn on d5 cramps him permanently and costs you nothing."},13:{n:"3...Nc6, main tabiya",p:"c4 and c5 next, prising open the queenside while his pieces are tangled. A space bind that needs no tactics at all."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 c8g4 b1c3 b8d7 c1e3 f8e7 d1d2 g8f6 h2h3 g4h5",san:"e4 e5 Nf3 d6 d4 Bg4 Nc3 Nd7 Be3 Be7 Qd2 Ngf6 h3 Bh5",tag:{5:{n:"Philidor, 3...Bg4",p:"He pins the knight to add pressure to d4."},6:{n:"Nc3 - ignore the pin",t:"main",p:"Develop and let him decide. The tempting dxe5 Bxf3 Qxf3 hands him easy equality after ...dxe5; keeping the tension is stronger."},13:{n:"3...Bg4, main tabiya",p:"h3 asks the bishop the question once you are ready. You are a clear tempo or two ahead in development."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 f7f5 f1c4 b8c6 b1c3 a7a6 e4f5 c8f5 e1g1",san:"e4 e5 Nf3 d6 d4 f5 Bc4 Nc6 Nc3 a6 exf5 Bxf5 O-O",tag:{5:{n:"Philidor Countergambit",t:"trap",p:"Aggressive and unsound. He throws the f-pawn to open lines at his own king."},6:{n:"Bc4! - develop at f7",t:"main",p:"Not the greedy exf5 or dxe5. Bc4 hits f7 at once, and every pawn move he has made weakened it. Engine: +1.7."},12:{n:"Countergambit refuted",p:"Two pawns' worth better with a safe king. Castle and open the f-file against him."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 d8e7 f1c4 h7h6 a2a4 g8f6 e1g1 c7c6",san:"e4 e5 Nf3 d6 d4 Qe7 Bc4 h6 a4 Nf6 O-O c6",tag:{5:{n:"Philidor, 3...Qe7",p:"He defends e5 with the queen, blocking in his own bishop."},11:{n:"3...Qe7, main tabiya",p:"Castle and play Re1. His queen is misplaced and his kingside undeveloped - build up, then open the centre when he cannot answer."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d6 d2d4 b8d7 f1c4 c7c6 d4e5",san:"e4 e5 Nf3 d6 d4 Nd7 Bc4 c6 dxe5",tag:{3:{n:"Philidor Defence",p:"Solid but passive \u2014 he blocks his own dark bishop. Very common at your level."},4:{n:"d4! \u2014 hit it at once",t:"main",p:"The pawn on d6 means he can't hold e5 comfortably. Take space immediately."},8:{n:"Philidor, main line",p:"Trade on e5 and you have a free game with more space. Then O-O, Re1, and press the e-file against his cramped position."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f7f5 f3e5 g8f6 f1c4 d8e7 d2d4",san:"e4 e5 Nf3 f5 Nxe5 Nf6 Bc4 Qe7 d4",tag:{3:{n:"Latvian Gambit",t:"trap",p:"The mirror image of the King's Gambit \u2014 and unsound. He's throwing a pawn to open the f-file at his OWN king."},4:{n:"Nxe5! \u2014 just take",t:"main",p:"Same reflex as the Damiano. Take the pawn; his king is the loose one."},8:{n:"Latvian refuted",p:"d4 and you're a clean pawn up with the better centre (+1.4). No tricks needed \u2014 develop and castle."}}},{b:"w",mv:"e2e4 b8c6 d2d4 d7d5 e4e5 c8f5 c2c3",san:"e4 Nc6 d4 d5 e5 Bf5 c3",tag:{1:{n:"Nimzowitsch Defence",p:"Provocative \u2014 he blocks his own c-pawn. Take the centre and he has to prove something."},4:{n:"Advance structure \u2014 familiar ground",t:"main",p:"This transposes into exactly the pawn chain you already play against the French and Caro-Kann. Same plans, no new theory."},6:{p:"c3, then Nf3, Be2, O-O. You have more space and he has a bad game."}}},{b:"w",mv:"e2e4 b7b6 d2d4 e7e6 f1d3 d7d5 b1c3",san:"e4 b6 d4 e6 Bd3 d5 Nc3",tag:{1:{n:"Owen's Defence",p:"He fianchettoes against your centre. Rare and not dangerous."},6:{n:"Owen's, main line",p:"Take the whole centre and develop. His b7 bishop bites on granite once you play Nc3 and f3 if needed."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 f7f5 b1c3 f5e4 c3e4",san:"e4 e5 Nf3 Nc6 Bb5 f5 Nc3 fxe4 Nxe4",tag:{5:{n:"Ruy Lopez: Schliemann (Jaenisch) Defence",t:"trap",p:"Aggressive and genuinely double-edged \u2014 he attacks your centre before developing. Don't panic and don't grab."},6:{n:"Nc3! \u2014 the safe answer",t:"main",p:"Adds a defender to e4 instead of taking. 4.exf5 and 4.Nxe5 both let him generate play; Nc3 keeps a solid edge."},8:{n:"Schliemann, main line",p:"You're a healthy +0.7 with a clean structure. Then d3, O-O and his weakened kingside becomes the target."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 d7d6 b1c3 f8e7 d2d4",san:"e4 e5 Nf3 Nc6 Bb5 d6 Nc3 Be7 d4",tag:{5:{n:"Ruy Lopez: Steinitz Defence",p:"Old and solid but cramped \u2014 he shuts in his own bishop to hold e5."},8:{n:"Steinitz Defence, main line",p:"d4 at the right moment. He has no space and no counterplay; just develop, castle and squeeze."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 c6d4 f3d4 e5d4 e1g1 g8f6 e4e5 f6d5 d2d3 d5b6 f1e1 f8c5 d1g4 e8f8",san:"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O Nf6 e5 Nd5 d3 Nb6 Re1 Bc5 Qg4 Kf8",tag:{9:{n:"Bird's Defence: 5...Nf6",p:"The most natural reply and the one you met."},10:{n:"e5! - kick first, develop after",t:"main",p:"This is the move the line was missing. Gain the tempo before he gets comfortable, and note WHY: his knight has to go to d5 where you hit it again with c4 or Re1 ideas. Do not play a slow queen move here - the pawn on d4 is not going anywhere and there is no rush to win it."},14:{n:"Re1 - the file, not the pawn",p:"Your compensation for the doubled-ish structure is development and the e-file. Take the file."},17:{n:"Bird's, main line",p:"You are around +1 with a lead in development and his king stuck on f8. The d4 pawn falls later with c3, or it just stays weak all game. Patience beats grabbing."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 c6d4 f3d4 e5d4 e1g1 c7c6 b5c4 g8f6 d2d3 d7d5 e4d5 f6d5 f1e1 f8e7",san:"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O c6 Bc4 Nf6 d3 d5 exd5 Nxd5 Re1+ Be7",tag:{9:{n:"Bird's: 5...c6",p:"He kicks the bishop before developing."},10:{n:"Bc4 - the good diagonal",t:"main",p:"Retreat to c4 where the bishop eyes f7, not back to a4 or e2. He has spent a move on a pawn."},16:{n:"Bird's 5...c6, main line",p:"Re1+ with check and you are comfortably better. His king cannot castle easily and the d4 pawn is a long-term target."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 c6d4 f3d4 e5d4 e1g1 f8c5 b5c4 d7d6 d2d3 c7c6 b1d2 g8f6",san:"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O Bc5 Bc4 d6 d3 c6 Nd2 Nf6",tag:{9:{n:"Bird's: 5...Bc5",p:"He defends d4 with the bishop."},10:{n:"Bc4 again",t:"main",p:"Same idea. Both bishops now point at f7."},15:{n:"Bird's 5...Bc5, main line",p:"d3 and Nd2 heading for e4 or b3 to hit the bishop. Solid plus, no tactics required."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 c6d4 f3d4 e5d4 e1g1",san:"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O",tag:{5:{n:"Ruy Lopez: Bird's Defence",p:"He jumps the knight to d4 to trade off your Spanish bishop's target."},6:{p:"Take. Simplest and best."},8:{n:"Bird's Defence, main line",p:"Castle and hit d4 with c3 later. His pawn on d4 is weak and your development is faster."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 d7d6 d2d4 b7b5 a4b3 c6d4 f3d4 e5d4 c2c3",san:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 d4 b5 Bb3 Nxd4 Nxd4 exd4 c3",tag:{7:{n:"Ruy Lopez: Modern Steinitz Defence",p:"4...d6 instead of ...Nf6. Solid, and it sets the oldest trap in the Spanish."},13:{n:"THE NOAH'S ARK TRAP",t:"trap",p:"Here is the moment. Do NOT play 8.Qxd4 \u2014 he answers ...c5! and then ...c4, and your bishop is walled in on b3 by the a6/b5/c4 pawns and simply lost. Engine: \u22122.5. It is called Noah's Ark because the pawns build an ark around the bishop."},14:{n:"c3! \u2014 the safe recapture",t:"main",p:"Take back with the pawn instead of the queen. Equal and completely safe. Also fine: 8.Bd5 or 8.a4. The rule: in the Spanish, never recapture on d4 with the queen while his queenside pawns can advance."}}},{b:"w",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6g4 h2h3 h7h5 d2d4",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Ng4 h3 h5 d4",tag:{7:{n:"The Fishing Pole Trap",t:"trap",p:"You'll meet this constantly online. The knight on g4 is bait \u2014 he WANTS you to chase it."},9:{n:"...h5!! \u2014 the hook",t:"trap",p:"Do NOT take. 6.hxg4?? hxg4 opens the h-file, the knight on f3 falls, and ...Qh4 mates. Engine: \u22122.6 the instant you take."},10:{n:"d4! \u2014 ignore the bait",t:"main",p:"Play in the centre and leave the knight alone. You're +1.7 because his kingside is wrecked and his knight on g4 is doing nothing. Also good: 6.c3 or 6.Ba4."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f7f6 f3e5 d8e7 e5f3 d7d5 d2d3",san:"e4 e5 Nf3 f6 Nxe5 Qe7 Nf3 d5 d3",tag:{3:{n:"Damiano Defence",t:"trap",p:"One of the oldest known errors in chess \u2014 named after the man who published the refutation in 1512. It defends e5 with a pawn that was doing better work at home."},4:{n:"Nxe5! \u2014 the refutation",t:"main",p:"Take. The f-pawn no longer covers anything useful and his king is naked on the e-file. 3.d4 is playable but misses the point \u2014 the refutation is a capture, not a build-up."},5:{p:"3...Qe7 is his only real defence \u2014 it declines the piece and settles for being a pawn down."},8:{n:"Damiano, 3...Qe7",p:"Retreat the knight, hold everything, stay a pawn up. He has no attack and a wrecked kingside."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f7f6 f3e5 f6e5 d1h5 e8e7 h5e5 e7f7 f1c4",san:"e4 e5 Nf3 f6 Nxe5 fxe5 Qh5+ Ke7 Qxe5+ Kf7 Bc4+",tag:{5:{n:"The greedy recapture",t:"trap",p:"If he takes the knight, it's over. This is the line worth memorising."},6:{n:"Qh5+! \u2014 winning",t:"main",p:"The whole idea. His king must step to e7 (g6 loses to Qxe5+ and the king is hunted), and from there you take on e5 with check and keep checking."},10:{n:"Damiano refuted",p:"Bc4+ and the king is dragged into the open with no defenders. This is a forced win, not just an advantage \u2014 engine calls it +3.4 and climbing."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f8c5 f3e5 d8h4 d2d4 d7d6 e5f7 h4e4 c1e3 c5b4 c2c3 e8f7",san:"e4 e5 Nf3 Bc5 Nxe5 Qh4 d4 d6 Nxf7 Qxe4+ Be3 Bb4+ c3 Kxf7",tag:{5:{n:"Busch-Gass: 3...Qh4!",t:"trap",p:"The real point of the gambit and the move that mates people. It hits f2 AND e4 at once, and f2 is defended only by the king. Any developing move loses on the spot: Nc3, Nf3, Bc4 all allow Qxf2 mate."},6:{n:"d4! - block and defend",t:"main",p:"The one move to know. d4 opens the queen's line to d2 so f2 is covered, attacks the bishop on c5, and builds the centre - three jobs in one move. 4.Qe2 and 4.Qf3 also hold; anything that does not address f2 is mate."},8:{n:"Nxf7! - the point",t:"main",p:"Now you win material back with interest. His king is dragged out and his queen is chasing pawns while you develop with check."},13:{n:"3...Qh4 refuted",p:"+2.3 for you. His king sits on f7 with no castling and no development. The lesson generalises: when an early queen attacks f2 or f7, count the defenders of that square before you touch anything else."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f8c5 f3e5 d8f6 d2d4 c5b6 f1c4",san:"e4 e5 Nf3 Bc5 Nxe5 Qf6 d4 Bb6 Bc4",tag:{3:{n:"Busch-Gass Gambit",t:"trap",p:"He hangs e5 to get fast development. Unsound \u2014 but only if you take and then keep developing."},4:{p:"Take the pawn. This is correct and the engine agrees \u2014 you're simply better."},5:{p:"He hits your knight and eyes b2. Everything now depends on not panicking."},6:{n:"The key move",p:"d4! blocks the queen's diagonal, builds the centre, and keeps the knight defended. Your knight on e5 is holding d4 \u2014 remember that."},8:{n:"Bc4 \u2014 the move to know",p:"Develop with tempo, hitting f7. The trap here is moving the e5 knight instead \u2014 it is the piece holding d4, and the moment it leaves, ...Qxd4 equalises. Never move a piece without asking what it was defending."}}},{b:"w",mv:"e2e4 e7e5 g1f3 f8c5 f3e5 b8c6 e5c6 d7c6 d2d3",san:"e4 e5 Nf3 Bc5 Nxe5 Nc6 Nxc6 dxc6 d3",tag:{5:{p:"The other try \u2014 he develops instead of checking with the queen."},8:{n:"Busch-Gass, ...Nc6 line",p:"Trade, then d3 to hold e4 and free your bishop. You're a clean pawn up with no weaknesses."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 f6e4 f1d3 f8b4 c2c3 b4e7 d3e4 d7d5",san:"e4 e5 Nf3 Nf6 d4 Nxe4 Bd3 Bb4+ c3 Be7 Bxe4 d5",tag:{7:{n:"Petroff, 4...Bb4+",t:"trap",p:"A check that looks annoying and is actually an error \u2014 but only if you block correctly. This is the single most important position in your Petroff line."},8:{n:"c3! \u2014 block with the PAWN",t:"main",p:"Blocking with the knight loses the exchange: it would be pinned by the bishop and attacked by the knight at the same time, and after the trades his bishop reaches the long diagonal and takes on a1. A pawn on c3 can't be pinned and can't be picked off. Rule: when a check can be blocked by a pawn or a piece, and the piece would arrive pinned, use the pawn."},9:{p:"The bishop has to retreat and you're nearly three pawns better \u2014 he has spent two moves to lose a tempo."},11:{n:"Petroff, 4...Bb4+ refuted",p:"Take the knight, and when ...d5 comes the bishop steps back to c2 or d3. Big centre, big lead, easy game."}}},{b:"w",mv:"e2e4 e7e5 g1f3 g8f6 d2d4 f6e4 f1d3 d7d5 f3e5 b8d7 e5d7 c8d7 e1g1",san:"e4 e5 Nf3 Nf6 d4 Nxe4 Bd3 d5 Nxe5 Nd7 Nxd7 Bxd7 O-O",tag:{7:{n:"Petroff, main line 4...d5",p:"The correct move and what you'll meet from stronger players. He holds the knight on e4 with a pawn."},8:{n:"Nxe5",t:"main",p:"Take back the pawn. His knight on e4 looks strong but it has no support once the dust settles."},12:{n:"Petroff, main line",p:"Castle and play c4 to hit d5. A small, safe edge \u2014 the Petroff is solid, so don't force it. Develop, pressure the centre, and take a long game."}}},{b:"w",mv:"e2e4 c7c5 g1f3 g7g6 c2c3 f8g7 d2d4",san:"e4 c5 Nf3 g6 c3 Bg7 d4",tag:{3:{n:"Sicilian, 2...g6",p:"He fianchettoes before developing the queenside."},4:{t:"main",p:"c3 and d4 \u2014 the same plan you use against 2...e6. Take the full centre while he's slow."},6:{n:"Sicilian 2...g6, main line",p:"Big centre, easy development. Then Bd3, O-O, and press."}}},{b:"w",mv:"e2e4 c7c5 g1f3 a7a6 c2c3 d7d5 e4d5 d8d5",san:"e4 c5 Nf3 a6 c3 d5 exd5 Qxd5",tag:{3:{n:"Sicilian, 2...a6 (O'Kelly)",p:"He stops Bb5 before you play it."},4:{t:"main",p:"No Bb5 available, so switch to the c3 plan \u2014 build the centre instead."},7:{n:"O'Kelly, main line",p:"His queen is out early. d4 next with tempo, then Nc3 and you're comfortably better."}}},{b:"w",mv:"e2e4 c7c5 g1f3 g8f6 e4e5 f6d5 d2d4 c5d4",san:"e4 c5 Nf3 Nf6 e5 Nd5 d4 cxd4",tag:{3:{n:"Sicilian: Nimzowitsch Variation",p:"He provokes the pawn push, hoping you overextend."},4:{t:"main",p:"Push anyway \u2014 the knight has no good square and you gain time."},7:{n:"Sicilian Nimzowitsch, main line",p:"Recapture on d4 and you have the centre and a clear space edge."}}},{b:"w",mv:"e2e4 d7d5 e4d5 d8d5 b1c3 d5e5 f1e2 c8g4 d2d4",san:"e4 d5 exd5 Qxd5 Nc3 Qe5+ Be2 Bg4 d4",tag:{5:{n:"Scandinavian, 3...Qe5+",p:"A check instead of a retreat. Answer it with a developing move, not a queen trade."},6:{n:"Be2! \u2014 block and develop",t:"main",p:"Blocking with the bishop develops a piece and keeps your edge. Trading queens with Qe2 releases all the pressure \u2014 his queen is the badly-placed piece, so leave it on."},8:{n:"Scandinavian 3...Qe5+, main line",p:"d4 with tempo. His queen has to move again and you're a clear pawn's worth ahead in development."}}},{b:"w",mv:"e2e4 a7a6 d2d4 e7e6 g1f3 d7d5",san:"e4 a6 d4 e6 Nf3 d5",tag:{1:{n:"St George Defence",p:"A wing move on move one. Take the centre and develop."},5:{n:"St George, main line",p:"You have the full centre for free. Nc3, Bd3, castle \u2014 no tricks needed."}}},{b:"w",mv:"e2e4 e7e6 d2d4 c7c5 d4d5",san:"e4 e6 d4 c5 d5",tag:{3:{n:"French, 2...c5",p:"He hits d4 before playing ...d5."},4:{n:"d5! \u2014 push past",t:"main",p:"Gain space with tempo. He can't take on d5 comfortably and his position stays cramped."}}},{b:"w",mv:"e2e4 b7b5 f1b5 c8b7 b1c3",san:"e4 b5 Bxb5 Bb7 Nc3",tag:{1:{n:"Polish Defence",p:"A pawn thrown away on move one."},2:{t:"main",p:"Take it. There is no compensation \u2014 develop normally and you are a clean pawn up."},4:{n:"Polish, refuted",p:"Nc3 holds e4 and you have an extra pawn with a better position."}}},{b:"w",mv:"e2e4 e7e5 g1f3 d7d5 e4d5 e5e4 d1e2",san:"e4 e5 Nf3 d5 exd5 e4 Qe2",tag:{4:{p:"Take. Declining is worse."},6:{n:"Elephant Gambit \u2014 refuted",t:"trap",p:"THE move. Defends the knight, attacks e4, kills his play. Never 3.Nxe5, never retreat the knight."}}},{b:"w",mv:"e2e4 c7c5 g1f3 b8c6 f1b5",san:"e4 c5 Nf3 Nc6 Bb5",tag:{4:{n:"Rossolimo Variation",p:"Low theory by design. Trade for the knight, damage his pawns, play a normal game. Never drift into d4 \u2014 that's the Open Sicilian and a whole career."}}},{b:"w",mv:"e2e4 c7c5 g1f3 d7d6 f1b5",san:"e4 c5 Nf3 d6 Bb5+",tag:{4:{n:"Moscow Variation",p:"Same bishop, same idea. This is how one move covers most Sicilians."}}},{b:"w",mv:"e2e4 c7c5 g1f3 e7e6 c2c3",san:"e4 c5 Nf3 e6 c3",tag:{4:{n:"Sicilian: Alapin (delayed)",p:"No Bb5 available here. Play c3 then d4 and take the big centre."}}},{b:"w",mv:"e2e4 e7e6 d2d4 d7d5 e4e5 c7c5 c2c3 b8c6 g1f3",san:"e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3",tag:{4:{n:"French Defence, Advance",p:"Locked pawn chain. You play on the kingside, he hits back with ...c5 and ...f6. Watch ...Qb6 hitting b2 and d4."},8:{p:"Defend d4, develop, castle. Identical structure to your Caro-Kann line."}}},{b:"b",mv:"e2e4 c7c5 c2c4 b8c6 b1c3 g7g6 g2g3 f8g7 f1g2 d7d6",san:"e4 c5 c4 Nc6 Nc3 g6 g3 Bg7 Bg2 d6",tag:{2:{n:"Sicilian: 2.c4 (Staunton-Cochrane)",p:"He grabs space with c4 (the Mar\xF3czy bind) and stops you ever playing ...d5. Equal, not dangerous \u2014 but you must not rush."},3:{p:"Nc6 is the move. Develop and treat it exactly like a Closed Sicilian."},9:{n:"Sicilian 2.c4, fianchetto setup",p:"Same shape you already know from the Closed Sicilian: ...Nc6, ...g6, ...Bg7, ...d6, then ...e6 and ...Nge7. He has space, you have a solid position and the ...b5 break later."}}},{b:"b",mv:"e2e4 c7c5 c2c4 g8f6 e4e5 f6g8",san:"e4 c5 c4 Nf6 e5 Ng8",tag:{3:{p:"Also playable \u2014 but it invites 3.e5 and the knight has nowhere good."},4:{n:"Sicilian 2.c4, 3.e5",t:"trap",p:"The critical moment. His pawn on e5 attacks your knight and there is only one good answer."},5:{n:"Ng8! \u2014 the ugly move that works",t:"main",p:"Retreat all the way home. It looks terrible and it is equal. The forward jumps both lose material \u2014 ...Ne4 to 4.d3, and ...Ng4 is worse still. His e5 pawn is the overextended one: accept the lost tempo and undermine it with ...d6."}}},{b:"w",mv:"e2e4 c7c6 d2d4 g8f6 e4e5 f6d5 c2c4 d5c7 b1c3",san:"e4 c6 d4 Nf6 e5 Nd5 c4 Nc7 Nc3",tag:{3:{n:"Caro-Kann, 2...Nf6",p:"Not the normal 2...d5. He develops instead, and this needs a different answer from your Advance line."},4:{n:"e5! \u2014 push, don't develop",t:"main",p:"Gain the tempo. Quiet development lets him settle; once you push, the knight has no good square."},8:{n:"Caro 2...Nf6, main setup",p:"c4 kicks it again and you own the centre with a big space edge (+1.0). Then Nc3, Be3, Nf3 \u2014 no tactics needed, just space."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 b8c6 c2c3 g8f6 c1f4 c8g4 d1b3 d8d7 b1d2 e7e6 g1f3 f8d6 f4d6 d7d6",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 Nc6 c3 Nf6 Bf4 Bg4 Qb3 Qd7 Nd2 e6 Ngf3 Bd6 Bxd6 Qxd6",tag:{4:{n:"Caro-Kann: Exchange Variation",t:"commit",p:"Resolve the centre at once. No pawn chain to be squeezed behind, no long-term bind, and the same setup against everything Black does: Bd3, c3, Nf3, Bf4, Nbd2, O-O. This is a system, not a line - the app will keep you in book whatever order you play them in."},6:{n:"Bd3 - always this square",t:"main",p:"The bishop belongs on d3 in every line here. It eyes h7 and supports the coming c3 and Nd2."},11:{n:"...Bg4 - the move to know",t:"trap",p:"His most natural developing move, and the one concrete thing to memorise in the whole variation."},12:{n:"Qb3! - the recurring shot",t:"main",p:"Hits b7 and d5 at the same time. This tactic appears in almost every Exchange game and it is the reason ...Bg4 does not work well for him. Learn this one move and the variation plays itself."},19:{n:"Exchange, main line",p:"Even material, symmetrical structure, all your pieces on their best squares. Plan from here: Rae1 and Ne5, or the minority attack with b4-b5. Nothing can go badly wrong."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 g8f6 h2h3 g7g6 g1f3 c8f5 e1g1 f5d3 d1d3 f8g7 f1e1 e8g8",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 Nf6 h3 g6 Nf3 Bf5 O-O Bxd3 Qxd3 Bg7 Re1 O-O",tag:{7:{n:"Exchange: 4...Nf6",p:"He develops before committing the bishop."},8:{n:"h3 - take the square first",t:"main",p:"A small useful move: it stops ...Bg4 for good. Now his bishop has to go to f5 where you can trade it off, and trading light bishops in this structure suits you."},17:{n:"4...Nf6, main line",p:"You have the bishop pair gone but a free game and the e-file. Re1, Ne5, then build on the kingside."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 e7e6 c1f4 b8c6 g1f3 f8d6 f4d6 d8d6 e1g1 g8e7 f1e1 e8g8",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 e6 Bf4 Nc6 Nf3 Bd6 Bxd6 Qxd6 O-O Nge7 Re1 O-O",tag:{7:{n:"Exchange: 4...e6",p:"Solid but it shuts in his own light bishop - the exact problem the Caro-Kann exists to avoid."},10:{n:"Bf4 and trade dark bishops",t:"main",p:"Offer the trade on d6. Every trade helps you here because his position is passive and he has less space to manoeuvre in."},17:{n:"4...e6, main line",p:"Castle, Re1, and consider Ne5 or the b4-b5 minority attack. He has no counterplay and no plan."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 a7a6 c1f4 b8c6 c2c3 g8f6 b1d2 c8g4 d1b3 d8c8 g1f3 e7e6",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 a6 Bf4 Nc6 c3 Nf6 Nd2 Bg4 Qb3 Qc8 Ngf3 e6",tag:{7:{n:"Exchange: 4...a6",p:"A waiting move. It stops nothing of yours."},15:{n:"Qb3 again",t:"main",p:"The same tactic as the main line - b7 and d5 at once. It keeps appearing because his queenside is loose in every Exchange line."},17:{n:"4...a6, main line",p:"You are comfortably better with a free extra tempo. Normal development wins here."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 c8g4 g1f3 e7e6 e1g1 g8f6 c2c3 b8c6 c1f4 f8d6 f4d6 d8d6",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 Bg4 Nf3 e6 O-O Nf6 c3 Nc6 Bf4 Bd6 Bxd6 Qxd6",tag:{7:{n:"Exchange: 4...Bg4 at once",p:"The bishop comes out before he has developed anything else."},8:{n:"Nf3 - develop, do not rush Qb3",t:"main",p:"Qb3 is less good here because his queen still covers b7 from d8 after ...Qc8 or ...Qb6. Develop normally: the bishop on g4 will be trading itself for your knight, which is fine for you."},17:{n:"4...Bg4, main line",p:"Bishops traded, structure symmetrical, king safe. Play Re1, Ne5 and press."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4d5 c6d5 f1d3 g7g6 c2c3 f8g7 g1f3 g8f6 h2h3 e8g8 e1g1 b8c6 f1e1 c8f5",san:"e4 c6 d4 d5 exd5 cxd5 Bd3 g6 c3 Bg7 Nf3 Nf6 h3 O-O O-O Nc6 Re1 Bf5",tag:{7:{n:"Exchange: 4...g6",p:"He fianchettoes to make his light bishop useful."},13:{n:"h3 - stop ...Bg4 before castling",t:"main",p:"The same prophylactic move. His bishop then has to come to f5 where you trade it."},17:{n:"4...g6, main line",p:"You have more space and an easy plan: Re1, Nbd2, Nf1-e3 hitting d5. His fianchetto bishop bites on your d4 pawn all game."}}},{b:"w",mv:"e2e4 c7c6 d2d4 d7d5 e4e5 c8f5 g1f3 e7e6 f1e2",san:"e4 c6 d4 d5 e5 Bf5 Nf3 e6 Be2",tag:{4:{n:"Caro-Kann, Advance",p:"Same structure as the French Advance \u2014 that's exactly why you play both. The difference: his light bishop escapes to f5 before ...e6."},8:{p:"Develop and castle, then consider harassing that bishop with Nh4 or g4 later."}}},{b:"w",mv:"e2e4 d7d5 e4d5 d8d5 b1c3 d5a5 d2d4 g8f6 g1f3",san:"e4 d5 exd5 Qxd5 Nc3 Qa5 d4 Nf6 Nf3",tag:{2:{p:"Take. Always take."},4:{n:"Scandinavian, 3.Nc3",p:"The whole trick: you hit his queen with a developing move. Your setup is the same wherever she runs \u2014 d4, Nf3, Bc4 or Be2, 0-0."},8:{p:"Then Bc4 or Be2, Bd2, castle. Never take b7 with your queen."}}},{b:"w",mv:"e2e4 d7d5 e4d5 d8d5 b1c3 d5d6 d2d4 g8f6 g1f3",san:"e4 d5 exd5 Qxd5 Nc3 Qd6 d4 Nf6 Nf3",tag:{8:{p:"Same setup as ...Qa5. One plan covers all three queen retreats \u2014 that's the point."}}},{b:"w",mv:"e2e4 d7d5 e4d5 d8d5 b1c3 d5d8 d2d4 g8f6 g1f3",san:"e4 d5 exd5 Qxd5 Nc3 Qd8 d4 Nf6 Nf3",tag:{8:{p:"He's lost two tempi for nothing. Just develop \u2014 you're clearly better."}}},{b:"w",mv:"e2e4 d7d5 e4d5 g8f6 d2d4 f6d5 g1f3",san:"e4 d5 exd5 Nf6 d4 Nxd5 Nf3",tag:{4:{n:"Modern Scandinavian",p:"Big centre. Do NOT play 3.c4 trying to hold the pawn \u2014 that hands him a real gambit."}}},{b:"w",mv:"e2e4 g8f6 e4e5 f6e4 d2d4 e7e6 g1h3 h7h6 d1g4 d7d5 f1d3",san:"e4 Nf6 e5 Ne4 d4 e6 Nh3 h6 Qg4 d5 Bd3",tag:{3:{n:"Alekhine: 2...Ne4",p:"Instead of the normal ...Nd5 he plants the knight on e4, where nothing supports it."},6:{n:"Nh3! - the accurate move",t:"main",p:"Not the natural Nf3. Nh3 heads for f4 to hit the knight and keeps f3 free for your pawn or queen. Engine: +1.4, best in the position."},10:{n:"2...Ne4, main line",p:"Qg4 hits g7 and Bd3 hits the knight. He cannot hold e4, and you keep the big centre plus the initiative."}}},{b:"w",mv:"e2e4 g8f6 e4e5 f6d5 d2d4 d7d6 g1f3",san:"e4 Nf6 e5 Nd5 d4 d6 Nf3",tag:{4:{n:"Alekhine: Main Line",p:"He wants you to overextend chasing the knight. Don't."},6:{n:"Alekhine, Modern Variation",p:"Then Be2, 0-0, c4 to kick ONCE, Nc3. Never the Four Pawns Attack \u2014 four pawn moves, no pieces, and that's the trap."}}},{b:"w",mv:"e2e4 b8c6 d2d4 e7e5 d4e5 c6e5 b1c3 f8b4 c1d2 g8f6",san:"e4 Nc6 d4 e5 dxe5 Nxe5 Nc3 Bb4 Bd2 Nf6",tag:{3:{n:"Nimzowitsch Defence: 2...e5",p:"The critical try - he hits your centre immediately instead of ...d5."},4:{n:"dxe5 - take and develop",t:"main",p:"Trade in the centre and develop with tempo. His knight has to spend a move recapturing."},9:{n:"2...e5, main line",p:"Bd2 unpins and you are comfortably better with the centre and a lead in development."}}},{b:"w",mv:"e2e4 d7d6 d2d4 g7g6 b1c3 f8g7 g1f3 g8f6 f1e2 e8g8",san:"e4 d6 d4 g6 Nc3 Bg7 Nf3 Nf6 Be2 O-O",tag:{3:{n:"Pirc: 2...g6",p:"The standard Pirc move order arriving one move earlier."},4:{n:"Nc3, then Nf3 and Be2",t:"main",p:"The Classical System - the safest and best-scoring setup against every Pirc move order. Take space, develop, castle, and refuse to lash out."},9:{n:"Pirc Classical, main line",p:"Big centre, everything developed, king safe. Now play Re1 and consider e5 or h3 and Be3. He must break with ...c5 or ...e5 and you meet it in the centre."}}},{b:"w",mv:"e2e4 d7d6 d2d4 b8d7 g1f3 g8f6 b1c3 e7e5 f1c4 f8e7",san:"e4 d6 d4 Nd7 Nf3 Ngf6 Nc3 e5 Bc4 Be7",tag:{3:{n:"Pirc: 2...Nd7",p:"He supports ...e5 before developing the king's knight."},8:{n:"...e5 - the freeing break",p:"This is what he was preparing."},9:{n:"2...Nd7, main line",p:"Bc4 aims at f7 while his king is still in the middle. Castle and press the centre; his pieces are tangled on the queenside."}}},{b:"w",mv:"e2e4 d7d6 d2d4 g8f6 b1c3 g7g6 g1f3",san:"e4 d6 d4 Nf6 Nc3 g6 Nf3",tag:{4:{n:"Pirc: Classical System",p:"Take space, develop, castle. He wins only if you lash out."}}},{b:"w",mv:"e2e4 g7g6 d2d4 f8g7 b1c3",san:"e4 g6 d4 Bg7 Nc3",tag:{4:{n:"Modern Defence: Standard Line",p:"Same treatment as the Pirc. One setup covers both."}}},{b:"w",mv:"e2e4 f7f6 d2d4 g7g5 d1h5",san:"e4 f6 d4 g5 Qh5#",tag:{1:{p:"Just a bad move \u2014 weakens the diagonal, develops nothing."},2:{p:"Take the centre. You'll win on development alone; don't go hunting."},4:{n:"Fool's Mate",t:"trap",p:"Always scan for this when Black weakens f6 and g5."}}},{b:"b",mv:"e2e4 e7e5 f2f4 f8c5 g1f3 d7d6 b1c3 g8f6 f1c4 b8c6 d2d3 c8g4",san:"e4 e5 f4 Bc5 Nf3 d6 Nc3 Nf6 Bc4 Nc6 d3 Bg4",tag:{2:{n:"King's Gambit",t:"trap",p:"Very common below 800 and it looks terrifying. He gives a pawn to rip open the f-file at your king."},3:{n:"...Bc5! - decline it",t:"main",p:"The safest answer by a distance. Taking on f4 is sound but leads to enormous theory; ...Bc5 develops, eyes f2, and means 3.fxe5 loses instantly to ...Qh4+. He now has a weakened king and nothing to show for it."},11:{n:"King's Gambit Declined, main line",p:"Castle next. His f-pawn is a permanent weakness and the g1-a7 diagonal is yours."}}},{b:"b",mv:"e2e4 e7e5 g1f3 b8c6 f1c4 f8c5 c2c3 g8f6 d2d3 d7d6 e1g1 e8g8",san:"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O",tag:{4:{n:"Italian Game",p:"The other side of the bishop you know so well."},5:{n:"...Bc5 - the Giuoco Piano",t:"main",p:"Mirror him. Symmetrical, solid, and nothing can go badly wrong if you develop and castle."},11:{n:"Giuoco Piano, main line",p:"Both castled, both developed. Play ...a6, ...Ba7 and ...Re8 - a slow game where the better plan wins, not the better memory."}}},{b:"b",mv:"e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 e4d6 b5c6 d7c6 d4e5 d6f5",san:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5",tag:{4:{n:"Ruy Lopez - from the other side",p:"You know this position intimately as White. Now you have to hold it."},5:{n:"...Nf6 - the Berlin",t:"main",p:"Your own book tells you what White wants here, so take the line that neutralises it. Queens come off and there is no attack to fear."},13:{n:"Berlin Wall, as Black",p:"You have the bishop pair, he has the better structure. Play ...Be7, ...h6 and bring the king to e8-d7. Solid to a fault, which is exactly what you want as the lower-rated side."}}},{b:"b",mv:"e2e4 e7e5 g1f3 b8c6 d2d4 e5d4 f3d4 f8c5 c1e3 d8f6 c2c3 g8e7",san:"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Bc5 Be3 Qf6 c3 Nge7",tag:{4:{n:"Scotch Game",p:"He opens the centre immediately instead of the Spanish."},7:{n:"...Bc5 - the classical answer",t:"main",p:"Hit the knight on d4 and develop. Simple and completely sound."},11:{n:"Scotch, main line",p:"...Qf6 and ...Nge7 hold everything. Equal, and his early central trade means fewer pieces and fewer chances for either of you to go wrong."}}},{b:"b",mv:"e2e4 e7e5 b1c3 g8f6 f2f4 d7d5 f4e5 f6e4 g1f3 f8e7",san:"e4 e5 Nc3 Nf6 f4 d5 fxe5 Nxe4 Nf3 Be7",tag:{2:{n:"Vienna Game",p:"Nc3 first, often heading for f4 with a King's-Gambit flavour."},5:{n:"...d5! - the standard break",t:"main",p:"The move that refutes the whole f4 idea. Strike back in the centre the moment he commits the f-pawn."},9:{n:"Vienna, main line",p:"You are already slightly better. Castle and his loose kingside becomes the target."}}},{b:"b",mv:"e2e4 e7e5 d2d4 e5d4 d1d4 b8c6 d4e3 g8f6 b1c3 f8e7",san:"e4 e5 d4 exd4 Qxd4 Nc6 Qe3 Nf6 Nc3 Be7",tag:{2:{n:"Centre Game",p:"He opens the centre but has to bring the queen out early to recapture."},5:{n:"...Nc6 - hit the queen",t:"main",p:"Develop with tempo. Every piece you develop chases his queen, which is the whole point."},9:{n:"Centre Game, main line",p:"You are level with easy development. Castle and play ...d5 or ...Re8 - his queen has cost him time he never gets back."}}},{b:"b",mv:"e2e4 e7e5 f1c4 g8f6 d2d3 c7c6 g1f3 d7d5 c4b3 f8d6",san:"e4 e5 Bc4 Nf6 d3 c6 Nf3 d5 Bb3 Bd6",tag:{2:{n:"Bishop's Opening",p:"Straight at f7 before developing a knight."},3:{n:"...Nf6 - develop and hit e4",t:"main",p:"Attack the pawn and make him solve the problem. Do not play ...Bc5 first here."},9:{n:"Bishop's Opening, main line",p:"...c6 and ...d5 give you the centre. He has spent his opening on one bishop."}}},{b:"b",mv:"e2e4 e7e5 d1h5 b8c6 f1c4 g7g6 h5f3 g8f6 g1e2 f8g7",san:"e4 e5 Qh5 Nc6 Bc4 g6 Qf3 Nf6 Ne2 Bg7",tag:{1:{n:"1...e5 \u2014 outside your repertoire",p:"Your prepared answer to 1.e4 is 1...c5. This branch exists only because you keep meeting early queen sorties here."},2:{n:"Wayward Queen Attack",t:"trap",p:"Also called the Parham. Objectively bad \u2014 the queen is a target \u2014 but it wins constantly below 800 because of one mate."},3:{p:"Nc6 defends e5 and develops. This is the move."},5:{n:"g6! \u2014 the only move",t:"trap",p:"NOT 3...Nf6, which loses instantly to 4.Qxf7#. That mate is the entire point of the opening. ...g6 attacks the queen and defends f7 at the same time."},7:{p:"His queen has now moved three times and achieved nothing while you've developed."},9:{n:"Wayward Queen, refuted",p:"Castle next. You're equal on the board and far ahead in useful moves \u2014 he's spent the opening walking his queen around."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 d1c2 e8g8 a2a3 b4c3 c2c3 b7b6 c1g5 c8b7 f2f3 h7h6 g5h4 d7d5",san:"d4 Nf6 c4 e6 Nc3 Bb4 Qc2 O-O a3 Bxc3+ Qxc3 b6 Bg5 Bb7 f3 h6 Bh4 d5",tag:{6:{n:"Nimzo-Indian: Classical (4.Qc2)",t:"main",p:"He avoids doubled pawns by recapturing with the queen. The main theoretical alternative to 4.e3."},17:{n:"Classical, main tabiya",p:"He has the bishop pair, you have quick development and pressure on e4. Play ...d5 and ...Nbd7 and keep the centre fluid."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 e2e3 e8g8 f1d3 c7c5 g1f3 d7d5 e1g1 d5c4 d3c4 b8d7 d1e2 b7b6 f1d1 c5d4",san:"d4 Nf6 c4 e6 Nc3 Bb4 e3 O-O Bd3 c5 Nf3 d5 O-O dxc4 Bxc4 Nbd7 Qe2 b6 Rd1 cxd4",tag:{8:{n:"H\xFCbner Variation",p:"...c5 before ...d5, aiming to fix his pawns on dark squares."},19:{n:"H\xFCbner, main tabiya",p:"Trade on d4 and blockade. Your knights are better than his bishops when the centre is locked."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 f2f3 d7d5 a2a3 b4c3 b2c3 c7c5 c4d5 f6d5 d4c5 d8a5",san:"d4 Nf6 c4 e6 Nc3 Bb4 f3 d5 a3 Bxc3+ bxc3 c5 cxd5 Nxd5 dxc5 Qa5",tag:{6:{n:"Nimzo-Indian: Kmoch (4.f3)",p:"He wants e4 immediately and doesn't mind wrecking his structure."},15:{n:"Kmoch, main tabiya",p:"...d5! straight away, before he gets e4 in. He is left with doubled pawns and a hole on e3."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 c1g5 h7h6 g5h4 c7c5 d4d5 d7d6 e2e3 b4c3 b2c3 e6e5",san:"d4 Nf6 c4 e6 Nc3 Bb4 Bg5 h6 Bh4 c5 d5 d6 e3 Bxc3+ bxc3 e5",tag:{6:{n:"Nimzo-Indian: Leningrad (4.Bg5)",p:"He pins your knight instead of developing."},15:{n:"Leningrad, main tabiya",p:"...h6 asks the bishop the question, then ...c5 hits the centre. His bishop on h4 ends up out of play."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 e2e3 e8g8 f1d3 d7d5 g1f3 c7c5 e1g1 b8c6 a2a3 b4c3 b2c3 d5c4 d3c4 d8c7",san:"d4 Nf6 c4 e6 Nc3 Bb4 e3 O-O Bd3 d5 Nf3 c5 O-O Nc6 a3 Bxc3 bxc3 dxc4 Bxc4 Qc7",tag:{6:{n:"Nimzo-Indian: Rubinstein Variation",t:"main",p:"4.e3 \u2014 by far the most common. Solid development, no early commitment."},15:{n:"Rubinstein, ...a3 moment",p:"He forces the trade. Take on c3 and target the doubled pawns."},19:{n:"Rubinstein, main tabiya",p:"You have the better structure, he has the bishop pair and the centre. Blockade c4, pressure the c-file, and keep the position closed enough that his bishops stay quiet."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 a2a3 b4c3 b2c3 c7c5 e2e3 b8c6 f1d3 e8g8 g1e2 b7b6 e3e4 f6e8",san:"d4 Nf6 c4 e6 Nc3 Bb4 a3 Bxc3+ bxc3 c5 e3 Nc6 Bd3 O-O Ne2 b6 e4 Ne8",tag:{6:{n:"Nimzo-Indian: S\xE4misch Variation",p:"He spends a tempo on a3 to force the trade immediately."},17:{n:"S\xE4misch, main tabiya",p:"Doubled c-pawns are his long-term problem. Blockade on c4, play ...Ne8-d6 and ...Ba6, and never let him get e4-e5 in cleanly."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 g1f3 c7c5 g2g3 c5d4 f3d4 e8g8 f1g2 d7d5 c4d5 f6d5",san:"d4 Nf6 c4 e6 Nc3 Bb4 Nf3 c5 g3 cxd4 Nxd4 O-O Bg2 d5 cxd5 Nxd5",tag:{6:{n:"Nimzo-Indian: Three Knights",p:"He develops rather than resolving the pin."},15:{n:"Three Knights, main tabiya",p:"Take on d4 and play ...d5. Free, comfortable equality with no memorisation."}}},{b:"b",mv:"d2d4 g8f6 c2c4 e7e6 b1c3 f8b4 g2g3 c7c5 g1f3 c5d4 f3d4 e8g8 f1g2 d7d5 c4d5 f6d5",san:"d4 Nf6 c4 e6 Nc3 Bb4 g3 c5 Nf3 cxd4 Nxd4 O-O Bg2 d5 cxd5 Nxd5",tag:{6:{n:"Nimzo-Indian: Fianchetto",p:"A Catalan-flavoured approach."},15:{n:"Fianchetto, main tabiya",p:"Same recipe as the Three Knights: ...c5, take on d4, then ...d5. His bishop is strong but your structure is fine."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 h2h3 e7e5 d4e2 b7b5 g2g4 c8b7 f1g2 b8d7 e2g3 h7h5",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 h3 e5 Nde2 b5 g4 Bb7 Bg2 Nbd7 Ng3 h5",tag:{10:{n:"Najdorf: Adams Attack",p:"h3 prepares g4 without weakening anything."},19:{n:"Adams Attack, main tabiya",p:"He is slow, so take space on the queenside immediately with ...b5 and ...Bb7."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1g5 e7e6 f2f4 f8e7 d1f3 d8c7 e1c1 b8d7 g2g4 b7b5 g5f6 d7f6 g4g5 f6d7",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7 g4 b5 Bxf6 Nxf6 g5 Nd7",tag:{10:{n:"Najdorf: 6.Bg5 Main Line",t:"main",p:"The sharpest and most testing move. He pins the knight and aims for f4, Qf3 and long castling."},15:{n:"Main Line, ...Qc7",p:"Your setup: ...Be7, ...Qc7, ...Nbd7 and ...b5. He attacks on the kingside, you on the queenside. Speed is everything."},23:{n:"6.Bg5, main tabiya",p:"He pushes g4-g5 and you must have ...b4 ready. Do not defend passively \u2014 in these positions the slower attack loses."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 f1e2 e7e5 d4b3 f8e7 e1g1 e8g8 c1e3 c8e6 f2f3 b8d7 d1d2 b7b5",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 f3 Nbd7 Qd2 b5",tag:{10:{n:"Najdorf: Classical (6.Be2)",t:"main",p:"The quiet, solid main line \u2014 and very common. He develops and castles rather than storming."},21:{n:"Classical, main tabiya",p:"A slow strategic game. Your plan: ...b5, ...Bb7, ...Nb6 and pressure on the c-file and the d5 square. Don't force it \u2014 this position is fully equal."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1e3 e7e5 d4b3 c8e6 f2f3 f8e7 d1d2 e8g8 e1c1 b8d7 g2g4 b7b5 g4g5 b5b4",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5 g5 b4",tag:{10:{n:"Najdorf: English Attack",t:"main",p:"f3, Qd2, O-O-O and a pawn storm. The most common serious try you will meet."},15:{n:"English Attack, ...Be7",p:"Get ...Be6, ...Nbd7 and ...b5 in fast. Both sides castle opposite ways and race."},23:{n:"English Attack, main tabiya",p:"He plays g4-g5, you play ...b4. Count the race before you defend \u2014 a tempo here is worth a piece."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1g5 e7e6 f2f4 d8b6 d1d2 b6b2 a1b1 b2a3 f4f5 b8c6 f5e6 f7e6 d4c6 b7c6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Qb6 Qd2 Qxb2 Rb1 Qa3 f5 Nc6 fxe6 fxe6 Nxc6 bxc6",tag:{13:{n:"Najdorf: Poisoned Pawn Variation",t:"trap",p:"Fischer's line. You take on b2 with your queen while he's building an attack \u2014 objectively sound, insanely sharp, and one wrong move is fatal."},23:{n:"Poisoned Pawn, main tabiya",p:"You're a pawn up with your queen stranded on a3 and your king still in the centre. Fully playable and analysed to move 30. Do not play this without studying it \u2014 ...Be7 and 7...Qb6 are a fork in the road, and the quiet path is fine."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 f1c4 e7e6 c4b3 b7b5 e1g1 f8e7 f2f4 e8g8 f4f5 e6e5 d4e2 c8b7",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bc4 e6 Bb3 b5 O-O Be7 f4 O-O f5 e5 Nde2 Bb7",tag:{10:{n:"Najdorf: Fischer-Sozin Attack",p:"The bishop eyes f7. Your answer is always the same: ...e6 first."},21:{n:"Fischer-Sozin, main tabiya",p:"He pushes f5 and you close with ...e5. His bishop on b3 is biting on granite and your ...b5-b4 comes fast."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 a2a4 e7e5 d4f3 f8e7 f1e2 e8g8 e1g1 b8c6 c1e3 c8e6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 a4 e5 Nf3 Be7 Be2 O-O O-O Nc6 Be3 Be6",tag:{10:{n:"Najdorf: 6.a4",p:"He stops ...b5 before it starts."},19:{n:"6.a4, main tabiya",p:"With ...b5 unavailable, switch plans: ...Nc6, ...Be6 and play on the d5 and b4 squares instead."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 f2f4 e7e5 d4f3 b8d7 a2a4 f8e7 f1d3 e8g8 e1g1 e5f4",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 f4 e5 Nf3 Nbd7 a4 Be7 Bd3 O-O O-O exf4",tag:{10:{n:"Najdorf: Amsterdam (6.f4)",p:"Direct, but it loosens his kingside."},19:{n:"Amsterdam, main tabiya",p:"Hit back in the centre with ...e5 and take on f4 when it suits you. His dark squares are permanently weak."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 g2g3 e7e5 d4e2 f8e7 f1g2 e8g8 e1g1 b7b5 h2h3 c8b7",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 g3 e5 Nde2 Be7 Bg2 O-O O-O b5 h3 Bb7",tag:{10:{n:"Najdorf: Fianchetto",p:"A slow setup aiming at d5."},19:{n:"Fianchetto, main tabiya",p:"Take the centre with ...e5 and neutralise the long diagonal with ...Bb7. Comfortable equality."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 f1b5 c8d7 c2c4 d7b5 d4b5 a7a6 b5c3 g7g6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Bb5+ Bd7 c4 Bxb5 Nxb5 a6 N5c3 g6",tag:{8:{n:"Open Sicilian: 5.Bb5+",t:"trap",p:"A check instead of Nc3. It looks annoying and it ignores his own e4 pawn - which is the point you must notice."},9:{n:"...Bd7 - block and ask",t:"main",p:"Block with the bishop. If he ever trades on d7 and leaves e4 unguarded, ...Nxe4 is simply a free pawn - check that every single time."},15:{n:"5.Bb5+, main line",p:"He spends two moves shuffling the knight to c3, which is where it was going anyway. You are fully equal with the two bishops gone and an easy ...Bg7, ...O-O, ...Nc6 to come."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 f2f3 e7e5 d4b3 d6d5 c1g5 d5d4 c2c3 b8c6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 f3 e5 Nb3 d5 Bg5 d4 c3 Nc6",tag:{8:{n:"Open Sicilian: 5.f3",p:"A slow build toward Be3, Qd2 and long castling - the English Attack without Nc3 yet."},9:{n:"...e5! - punish the slow move",t:"main",p:"He has not developed a piece since move 4. Take the centre at once: the knight has to retreat and ...d5 comes next with total equality."},15:{n:"5.f3, main line",p:"Dead level. He has a hole on e3 and a bad bishop; you have a clean position and the ...d5 break already in."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 f1d3 b8c6 c1e3 f6g4 d4c6 b7c6 e3d2 g7g6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Bd3 Nc6 Be3 Ng4 Nxc6 bxc6 Bd2 g6",tag:{8:{n:"Open Sicilian: 5.Bd3",p:"Passive - the bishop blocks his own d-file and stares at his own knight."},9:{n:"...Nc6 - develop and hit",t:"main",p:"Attack the knight on d4 and develop. Nothing clever needed against a passive move."},15:{n:"5.Bd3, main line",p:"You trade off his best-placed knight and fianchetto. Comfortable, and his light bishop has no future."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 d1d3 b8c6 b1c3 g7g6 f2f3 c6d4 d3d4 f8g7",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Qd3 Nc6 Nc3 g6 f3 Nxd4 Qxd4 Bg7",tag:{8:{n:"Open Sicilian: 5.Qd3",p:"An early queen sortie to support Nc3 and f3."},9:{n:"...Nc6",t:"main",p:"Standard: hit d4, develop, and note the queen is already a target on the d-file once you play ...d5 or trade on d4."},15:{n:"5.Qd3, main line",p:"Trade on d4 to pull his queen forward, then ...Bg7 and ...O-O. His queen out early costs him time."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 c2c4 e7e5 b1c3 g7g6 d2d3 b8c6 a1b1 f8g7 g2g3 g8e7 f1g2",san:"e4 c5 Nf3 d6 c4 e5 Nc3 g6 d3 Nc6 Rb1 Bg7 g3 Nge7 Bg2",tag:{4:{n:"Sicilian: 3.c4 (Mar\xF3czy setup)",p:"He clamps down on d5 with two pawns. Nothing sharp \u2014 he is playing for a long squeeze."},5:{n:"...e5! \u2014 take the centre he left",t:"main",p:"If he takes d5 away from you, take e5 for yourself. The moment his c-pawn goes to c4 the d4 square stops being his, so occupy the centre with the other pawn and his bind achieves nothing."},14:{n:"3.c4, main line",p:"Dead level. Fianchetto with ...g6 and ...Bg7, put a knight on e7 rather than f6 so it eyes d5, and play ...f5 later. He has space and no way in."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 c2c4 g8f6 b1c3 e7e5 a2a3 b8c6 a1b1 f8e7 d2d3 e8g8 b2b4",san:"e4 c5 Nf3 d6 c4 Nf6 Nc3 e5 a3 Nc6 Rb1 Be7 d3 O-O b4",tag:{5:{n:"...Nf6 \u2014 also fine",t:"main",p:"Your move, and perfectly sound at +0.16. It develops with a hit on e4 and usually transposes to the same structure after ...e5 next move."},14:{n:"3.c4 with ...Nf6, main line",p:"Same picture: he gets queenside space with b4, you get the centre and the d4 square. Level, and easier to play than it looks."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f3h4 g8f6 b1c3 b8c6 g2g3 a8b8 a2a4 d6d5 d2d3 d5d4 c3b5",san:"e4 c5 Nf3 d6 Nh4 Nf6 Nc3 Nc6 g3 Rb8 a4 d5 d3 d4 Nb5",tag:{5:{n:"Sicilian: 3.Nh4 with ...Nf6",p:"Your move, and a good one \u2014 it hits e4 and forces him to deal with you. ...Nc6 is a shade better and simpler, but there is nothing wrong with this."},7:{p:"...Nc6 comes next anyway, so the two move orders converge. Your instinct about following up with the knight was right."},14:{n:"3.Nh4 with ...Nf6, main line",p:"Around \u22120.3 for you. He has spent three moves on a knight that ends up on b5 achieving nothing, while you have the centre and the queenside break."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f3h4 b8c6 b1c3 g7g6 g2g3 a8b8 a2a4 a7a6 f1g2 b7b5 a4b5",san:"e4 c5 Nf3 d6 Nh4 Nc6 Nc3 g6 g3 Rb8 a4 a6 Bg2 b5 axb5",tag:{4:{n:"Sicilian: 3.Nh4",p:"A knight to the rim, unsupported, on move three. Nothing to fear \u2014 but nothing to rush at either."},5:{n:"...Nc6 \u2014 develop, don't chase",t:"main",p:"Simply the best move. ...Nf6 also works and hits e4, but ...Nc6 is a touch better and simpler: it develops toward the centre and keeps every option. Resist the urge to punish the knight directly \u2014 it will have to come back on its own and you gain more by building."},14:{n:"3.Nh4, main line",p:"You end up with the queenside expansion for free while his knight has spent moves getting nowhere. Fully comfortable at around \\u22120.4."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 d1d3 d7d5 d3b5 b8d7 c1f4 c7c5 c2c3 f6h5 e2e3 c5c4 f1e2 h5f4 e3f4",san:"d4 Nf6 Nf3 e6 Qd3 d5 Qb5+ Nbd7 Bf4 c5 c3 Nh5 e3 c4 Be2 Nxf4 exf4",tag:{4:{n:"Queen's Pawn: 4.Qd3",p:"An early queen move. Take the centre and make her pay for it."},6:{n:"Qb5+ \u2014 the check that achieves nothing",t:"trap",p:"It looks like it wins something and it wins a tempo for YOU, because every piece you develop hits her."},7:{n:"...Nbd7 \u2014 block and develop",t:"main",p:"Blocking with the knight is good; ...c6 is fractionally better because it hits the queen immediately and gains the tempo back. Either is fine \\u2014 the principle is to block with something that also does a job."},16:{n:"4.Qd3, main line",p:"You are around \\u22120.8: his queen has moved three times, you have the centre and the bishop pair. Castle and open a file at your leisure."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1g5 e7e6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6",tag:{1:{n:"Sicilian Defence",p:"You always choose this. From here HE picks the branch \u2014 that's why there are so many."},3:{p:"Not 2...Nc6. This move order dodges the Rossolimo and steers to the Najdorf."},9:{n:"Najdorf Variation",t:"main",p:"The little a6 IS the opening \u2014 it stops Nb5 and prepares ...b5. Then ...e5 or ...e6, ...Be7, castle, expand on the queenside."},11:{n:"Najdorf, Main Line",p:"The sharpest position in chess. ...e6 first, then ...Be7 and ...Qc7."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1e3 e7e5",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5",tag:{11:{n:"English Attack",p:"He'll play f3, Qd2, 0-0-0 and storm your king. Get ...Be6, ...Nbd7 and ...b5 in fast \u2014 it's a race."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 f1c4 e7e6",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bc4 e6",tag:{11:{n:"Fischer\u2013Sozin Attack",p:"...e6 immediately, blunting the bishop. Same reflex you use against Bc4 anywhere."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 h2h3 e7e5",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 h3 e5",tag:{11:{n:"Adams Attack",p:"He's preparing g4. Take the centre while he's being slow."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 f2f4 e7e5",san:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 f4 e5",tag:{11:{n:"Najdorf, 6.f4",p:"Hit back in the centre straight away."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f1b5 c8d7",san:"e4 c5 Nf3 d6 Bb5+ Bd7",tag:{5:{n:"Moscow Variation",p:"Simplest reply. Then ...Nf6, ...e6, ...Be7, castle. No Najdorf theory needed \u2014 comfortable, equal."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f1c4 g8f6 f3g5 e7e6 d2d3 d6d5 c4b3 h7h6",san:"e4 c5 Nf3 d6 Bc4 Nf6 Ng5 e6 d3 d5 Bb3 h6",tag:{6:{n:"Bowdler: 4.Ng5",t:"trap",p:"He jumps at f7 before you have castled. It looks frightening and is not."},7:{n:"...e6! - the only move to know",t:"main",p:"Blunt the bishop and defend f7 in one. Engine: you are already better. The natural-looking ...Bg4 is the error - it walks into f3 and g4 and the bishop gets hunted down."},11:{n:"Bowdler 4.Ng5, refuted",p:"...h6 kicks the knight and he has nothing: two tempi spent on a knight that must come home, while you own the centre."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f1c4 g8f6 e4e5 d6e5 f3e5 e7e6 d1e2 f8d6 d2d3 e8g8",san:"e4 c5 Nf3 d6 Bc4 Nf6 e5 dxe5 Nxe5 e6 Qe2 Bd6 d3 O-O",tag:{6:{n:"Bowdler: 4.e5",t:"trap",p:"He pushes past to open the f7 diagonal. This is the critical branch of the whole Bc4 Sicilian - handle it and the opening is comfortable."},7:{p:"Take. This is correct and leaves you slightly better."},9:{n:"...e6! - count the attackers on f7",t:"main",p:"After Nxe5 the f7 square has TWO attackers, the bishop on c4 and the knight on e5, and exactly one defender: your king. ...e6 blocks the bishop and the problem disappears. Any developing move that ignores f7 - ...Bg4, ...Nc6, ...g6 - loses to Bxf7. This is the same ...e6 reflex the book gives you against Bc4 everywhere else; the pawn push does not change it."},13:{n:"Bowdler 4.e5, main line",p:"...Bd6 hits the knight, then castle. He has spent moves on a push that achieved nothing and you are fully equal with the safer king."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 f1c4 g8f6 b1c3 e7e6",san:"e4 c5 Nf3 d6 Bc4 Nf6 Nc3 e6",tag:{5:{n:"Bowdler, 3...Nf6",p:"Develop with tempo \u2014 you're hitting e4."},7:{p:"...e6 shuts the bishop down. Then ...a6 and ...b5 keep kicking it. Avoid early ...g6 (f7 gets loose) and early ...e5 (gives him d5)."}}},{b:"b",mv:"e2e4 c7c5 c2c3 g8f6 e4e5 f6d5 d2d4 c5d4",san:"e4 c5 c3 Nf6 e5 Nd5 d4 cxd4",tag:{3:{n:"Alapin, 2...Nf6",p:"Very common below 1500 \u2014 learn this one early."},7:{p:"Chip at his centre immediately. Then ...d6, ...Nc6, ...e6 and he has nothing."}}},{b:"b",mv:"e2e4 c7c5 b1c3 b8c6 c3b5 g8f6 b5c3 e7e6 g1f3 d7d5",san:"e4 c5 Nc3 Nc6 Nb5 Nf6 Nc3 e6 Nf3 d5",tag:{4:{n:"Closed Sicilian, 3.Nb5",p:"An early knight sortie. It looks scary because it eyes d6 and c7, but the knight has no support and no way to stay there."},5:{n:"...Nf6! \u2014 develop, don't lash out",t:"main",p:"Hit e4 and make him deal with you; ...a6 is equally good. What loses is throwing pawns at the knight \u2014 an early ...d5 runs into exd5 and Qh5. A piece with no support cannot stay: let it retreat on its own."},6:{p:"The knight has to come home. You've gained a tempo for nothing."},9:{n:"3.Nb5 refuted",p:"...e6 and ...d5 and you have a free game with the better centre. The rule for every early sortie: develop with tempo, don't chase."}}},{b:"b",mv:"e2e4 c7c5 b1c3 b8c6 d2d3 g7g6 g2g3 f8g7 f1g2 d7d6",san:"e4 c5 Nc3 Nc6 d3 g6 g3 Bg7 Bg2 d6",tag:{4:{n:"Closed Sicilian, 3.d3",p:"A different move order, the same opening. Don't be thrown by it."},5:{p:"Your setup doesn't change: ...g6, ...Bg7, ...d6, ...e6, ...Nge7. Move orders vary; the shape doesn't."},9:{n:"Closed Sicilian, transposed",p:"Identical to the 3.g3 line. Then ...Rb8 and ...b5 on the queenside. Don't rush ...e5 \u2014 pushing the centre before you are developed hands over the initiative."}}},{b:"b",mv:"e2e4 c7c5 b1c3 b8c6 f1c4 e7e6 g1f3 g8f6 d2d4 d7d5 e4d5 e6d5 c4b5 c8d7",san:"e4 c5 Nc3 Nc6 Bc4 e6 Nf3 Nf6 d4 d5 exd5 exd5 Bb5 Bd7",tag:{4:{n:"Sicilian: 2.Nc3 and 3.Bc4",p:"The bishop comes out before he has decided on a system. Aimed at f7 as always."},5:{n:"...e6! - the fifth time",t:"main",p:"This is now the answer to Bc4 in five separate positions in your book: 2.Bc4, 3.Bc4 in the Najdorf order, 4.Ng5, 3.Qf3, and here. If a bishop lands on c4 and you have no better idea, ...e6 is the move. Engine has you level immediately."},9:{p:"...d5 hits the centre. With the diagonal shut you can afford to open the position."},13:{n:"3.Bc4, main line",p:"Fully equal with easy development: ...Bd7, ...Be7, castle. His bishop has spent the opening being blunted and then chased."}}},{b:"b",mv:"e2e4 c7c5 b1c3 b8c6 g2g3 g7g6 f1g2 f8g7",san:"e4 c5 Nc3 Nc6 g3 g6 Bg2 Bg7",tag:{3:{n:"Closed Sicilian, 2...Nc6",p:"Also covers the Grand Prix."},7:{p:"Fianchetto, then play on the queenside with ...Rb8 and ...b5. If he goes f4 and Bc4, get ...e6 in and castle fast."}}},{b:"b",mv:"e2e4 c7c5 d2d4 c5d4 c2c3 d4c3 b1c3 b8c6 g1f3 d7d6 f1c4 e7e6",san:"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6",tag:{4:{n:"Smith-Morra Gambit",t:"trap",p:"He gives a pawn for fast development and open files."},5:{p:"Accept once. Refusing gambits out of fear leaves you worse for nothing."},11:{n:"Smith-Morra, ...a6/...e6 fortress",p:"The setup: ...a6, ...e6, ...Nf6, ...Be7, castle. Never greedy, and never leave your king in the centre with the d-file open."}}},{b:"b",mv:"e2e4 c7c5 b2b4 c5b4 a2a3 d7d5 e4d5 d8d5 g1f3",san:"e4 c5 b4 cxb4 a3 d5 exd5 Qxd5 Nf3",tag:{2:{n:"Sicilian: Wing Gambit",t:"trap",p:"He gives the b-pawn for the centre. Unsound \u2014 but only if you hit back immediately."},3:{p:"Take it. Refusing gambits out of nerves leaves you worse for nothing."},5:{n:"...d5! \u2014 the refutation",t:"main",p:"Don't cling to the extra pawn \u2014 strike the centre while he's spent two moves on the wing. This is the whole answer."},8:{n:"Wing Gambit refuted",p:"You're \u22120.45 and better: extra pawn, better centre, and his queenside is full of holes. Then ...Nc6, ...e6, ...Nf6 and castle."}}},{b:"b",mv:"e2e4 c7c5 f1c4 g8f6 d1f3 e7e6 g1e2 b8c6 d2d3 d7d5 c4b3 d5e4 d3e4 f8e7",san:"e4 c5 Bc4 Nf6 Qf3 e6 Ne2 Nc6 d3 d5 Bb3 dxe4 dxe4 Be7",tag:{4:{n:"Bowdler: 3.Qf3",t:"trap",p:"Bishop on c4 plus queen on f3 means both are aimed at f7. Same idea as the Wayward Queen and Scholar's Mate, one move later."},5:{n:"...e6! - the same answer as always",t:"main",p:"This is now the reply to Bc4 in FOUR different positions: 2.Bc4, 3.Bc4 in the Najdorf move order, 4.Ng5, and here. Block the diagonal first, then develop. You are already better after it."},9:{n:"...d5 - now the break works",p:"With e6 played and the diagonal shut, opening the centre is safe. Doing it earlier, while your king is in the middle and a bishop is loose, is what loses these games."},13:{n:"3.Qf3 refuted",p:"His queen has moved twice and is misplaced on f3; you have four pieces out and a clean structure. Castle next and his attack never existed."}}},{b:"b",mv:"e2e4 c7c5 f1c4 g8f6 b1c3 e7e6 g1f3 a7a6",san:"e4 c5 Bc4 Nf6 Nc3 e6 Nf3 a6",tag:{2:{n:"Sicilian: Bowdler Attack",p:"The bishop comes out early, aiming at f7 before he's developed anything else."},3:{p:"Nf6 hits e4 and gains time."},5:{p:"...e6 shuts the bishop's diagonal \u2014 the same reflex you use against Bc4 anywhere."},7:{n:"Bowdler, ...a6 setup",p:"Then ...b5 kicks the bishop and you have a free Sicilian with extra tempi. Dead equal or better."}}},{b:"b",mv:"d2d4 g8f6 b1c3 d7d5 c1g5 c7c5 e2e3 e7e6",san:"d4 Nf6 Nc3 d5 Bg5 c5 e3 e6",tag:{4:{n:"Richter-Veresov Attack",p:"Bg5 instead of Bf4 \u2014 the other half of the Rapport-Jobava family."},5:{n:"...c5! \u2014 same idea as the London",t:"main",p:"Challenge d4 straight away. Identical principle to your London answer: never sit passively against a system."},7:{n:"Veresov, main setup",p:"Then ...Nc6, ...Be7 and castle. If he ever takes on f6 you get the bishop pair; if he keeps the pin, ...h6 asks the question."}}},{b:"b",mv:"d2d4 g8f6 g1f3 e7e6 e2e3 c7c5 f1d3 b8c6",san:"d4 Nf6 Nf3 e6 e3 c5 Bd3 Nc6",tag:{4:{n:"Colle System",p:"Another no-c4 system: e3, Bd3, c3, Nbd2, then a big e4 push. He plays it on autopilot."},5:{p:"...c5 again. The answer to every one of these systems is the same."},7:{n:"Colle, main setup",p:"Then ...d5, ...Bd6 or ...Be7, castle. Watch for his e4 break \u2014 meet it by taking and hitting his loose d4 pawn."}}},{b:"b",mv:"e2e4 c7c5 f2f3 d7d5 e4d5 d8d5 b1c3 d5e5 g1e2 b8c6 d2d4 c5d4",san:"e4 c5 f3 d5 exd5 Qxd5 Nc3 Qe5+ Nge2 Nc6 d4 cxd4",tag:{2:{n:"Sicilian, 2.f3",p:"A bad move \u2014 it blocks his own knight and weakens the a7-g1 diagonal. You're already better here."},3:{p:"Strike in the centre immediately. He can't hold d5 with a pawn on f3."},7:{p:"The check is fine \u2014 it grabs a tempo before he can develop naturally."},11:{n:"Sicilian 2.f3, refuted",t:"main",p:"Take on d4 and you're clearly better. The trap is shuffling the queen instead \u2014 she is already out early, and every extra queen move is a free tempo for him. Grab the centre, then bring her home once your pieces are out."}}},{b:"b",mv:"e2e4 c7c5 f2f4 d7d5",san:"e4 c5 f4 d5",tag:{3:{n:"McDonnell Attack",p:"Hit the centre immediately. Rare, but this is the whole answer."}}},{b:"b",mv:"b2b3 g8f6 c1b2 e7e6 e2e3 c7c5",san:"b3 Nf6 Bb2 e6 e3 c5",tag:{0:{n:"Nimzo-Larsen Attack",p:"He fianchettoes at your centre instead of occupying it."},1:{t:"main",p:"...Nf6 and ...e6 again \u2014 the same two moves answer almost every first move he can play."},5:{n:"Nimzo-Larsen, main setup",p:"...c5 hits d4 before he gets there. Then ...Nc6, ...Be7, castle."}}},{b:"b",mv:"f2f4 d7d5 g1f3 g8f6 e2e3 e7e6",san:"f4 d5 Nf3 Nf6 e3 e6",tag:{0:{n:"Bird's Opening",p:"A reversed Dutch. His f-pawn weakens the a7-g1 diagonal and the e-file."},1:{t:"main",p:"Take the centre at once. He can't contest d5."},5:{n:"Bird's, main setup",p:"...Be7, castle, then ...c5. His weakened kingside becomes a target later."}}},{b:"b",mv:"g2g4 d7d5 f1g2 c8g4 c2c4 c7c6 d1b3 e7e6 b3b7 b8d7 b1c3 g8f6",san:"g4 d5 Bg2 Bxg4 c4 c6 Qb3 e6 Qxb7 Nd7 Nc3 Ngf6",tag:{3:{n:"Grob Gambit accepted",p:"Taking is objectively best and the engine likes it, but know what is coming."},6:{n:"Qb3! - the point of the gambit",t:"trap",p:"His queen hits b7 and d5 together. This is why the greedy line needs preparation."},7:{n:"...e6 - hold the centre, give the pawn",t:"main",p:"Defend d5 with a piece behind it and let b7 go. You are still clearly better after Qxb7 because his queen is stranded and every move you make develops with tempo."},11:{n:"Grob accepted, main line",p:"A pawn down and winning: he has no centre, no king safety and a queen on the run. If that makes you uncomfortable, use the ...c6 line instead - it is nearly as good and far calmer."}}},{b:"b",mv:"g2g4 d7d5 f1g2 c7c6 h2h3 h7h5 g4h5 g8f6 d2d4 c8f5 c2c4 e7e6",san:"g4 d5 Bg2 c6 h3 h5 gxh5 Nf6 d4 Bf5 c4 e6",tag:{0:{n:"Grob Opening",t:"trap",p:"1.g4. It looks absurd because it is - he weakens his own king before developing anything. Do not get greedy and do not get careless."},1:{n:"...d5 - take the centre",t:"main",p:"Occupy the middle at once. Engine already has you better."},2:{n:"Grob Gambit: 2.Bg2",p:"He offers the g-pawn to open the long diagonal at your d5 pawn and your b7 square."},3:{n:"...c6! - decline and be solid",t:"main",p:"The practical choice: defend d5 with the pawn and refuse the gift. Taking on g4 is objectively fine too, but it invites Qb3 hitting b7 and d5 at once, and you do not need that. With ...c6 in you are simply better with no risk."},11:{n:"Grob declined, main line",p:"You have the centre, he has a shattered kingside and no development. Play ...Nbd7, ...Be7 and castle - queenside if his h-file pressure ever looks real."}}},{b:"b",mv:"g2g3 g8f6 f1g2 d7d5 g1f3 e7e6",san:"g3 Nf6 Bg2 d5 Nf3 e6",tag:{0:{n:"King's Fianchetto Opening",p:"Slow and flexible. It nearly always transposes into a Catalan or R\xE9ti."},5:{n:"Fianchetto, transposed",p:"Standard shape: ...Be7, castle, ...c5. If c4 appears you are in your Catalan line."}}},{b:"b",mv:"b1c3 d7d5 e2e4 d5d4 c3e2 e7e5",san:"Nc3 d5 e4 d4 Nce2 e5",tag:{0:{n:"Van Geet (Dunst) Opening",p:"An offbeat knight move. Take the centre and he has nothing."},3:{t:"main",p:"Push past. The knight must move again and you own the centre."},5:{n:"Dunst, refuted",p:"Two big pawns in the middle and he has spent moves on a knight that keeps retreating."}}},{b:"b",mv:"b2b4 d7d5 c1b2 g8f6 a2a3 e7e6",san:"b4 d5 Bb2 Nf6 a3 e6",tag:{0:{n:"Sokolsky (Orangutan)",p:"A wing pawn on move one. Answer play on the wing with play in the centre."},5:{n:"Sokolsky, main setup",p:"...c5 next, hitting the b4 pawn and the centre together. You are simply better."}}},{b:"b",mv:"d2d3 d7d5 g1f3 g8f6 g2g3 e7e6",san:"d3 d5 Nf3 Nf6 g3 e6",tag:{0:{n:"King's Indian Attack",p:"He builds behind his own lines. Nothing to fear \u2014 take the space he is giving you."},5:{n:"KIA, main setup",p:"...Be7, castle, ...c5. You have more space; don't rush and don't weaken."}}},{b:"b",mv:"e2e3 g8f6 d2d4 e7e6 g1f3 d7d5",san:"e3 Nf6 d4 e6 Nf3 d5",tag:{0:{n:"Van 't Kruijs Opening",p:"A waiting move that transposes almost immediately."},5:{n:"Transposed to Queen's Pawn",p:"You are in your 1.d4 book. Play on as normal."}}},{b:"b",mv:"e2e4 c7c5 g2g3 b8c6 f1g2 g7g6",san:"e4 c5 g3 Nc6 Bg2 g6",tag:{2:{n:"Sicilian, 2.g3",p:"A quiet fianchetto approach."},5:{n:"Sicilian 2.g3, main setup",p:"Mirror him: ...g6, ...Bg7, ...d6, ...e6. Same shape as your Closed Sicilian."}}},{b:"b",mv:"e2e4 c7c5 d2d3 b8c6 g2g3 g7g6",san:"e4 c5 d3 Nc6 g3 g6",tag:{2:{n:"Sicilian, 2.d3",p:"A King's Indian Attack setup against the Sicilian."},5:{n:"Sicilian 2.d3, main setup",p:"Same fianchetto answer. Then ...Bg7, ...d6, ...e6 and expand with ...b5."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 c2c3 g8f6 f1d3 b8c6",san:"e4 c5 Nf3 d6 c3 Nf6 Bd3 Nc6",tag:{4:{n:"Sicilian, 3.c3",p:"A delayed Alapin. He wants d4 with a big centre."},5:{t:"main",p:"Develop and hit e4. Don't let him build unopposed."},7:{n:"Delayed Alapin, main setup",p:"Then ...g6 or ...e6 and castle. Meet his d4 by taking."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 b1c3 g8f6 d2d4 c5d4",san:"e4 c5 Nf3 d6 Nc3 Nf6 d4 cxd4",tag:{4:{n:"Sicilian, 3.Nc3",p:"Almost always a move order heading for the Open Sicilian."},7:{n:"Transposing to your Najdorf",p:"After Nxd4 you play ...a6 and you are in the Najdorf. Nothing new \u2014 just a different move order."}}},{b:"b",mv:"e2e4 c7c5 g1f3 d7d6 d2d3 b8c6 g2g3 g7g6",san:"e4 c5 Nf3 d6 d3 Nc6 g3 g6",tag:{4:{n:"Sicilian, 3.d3",p:"King's Indian Attack again."},7:{n:"Sicilian 3.d3, main setup",p:"Fianchetto, castle, then ...Rb8 and ...b5. He has no pressure to create."}}},{b:"b",mv:"d2d4 g8f6 g2g3 d7d5 f1g2 e7e6",san:"d4 Nf6 g3 d5 Bg2 e6",tag:{2:{n:"Queen's Pawn, 2.g3",p:"Heading for a Catalan without committing to c4 yet."},5:{n:"2.g3, main setup",p:"...Be7, castle, ...c5. If c4 comes you are in your Catalan line."}}},{b:"b",mv:"d2d4 g8f6 c2c3 d7d5 c1f4 e7e6",san:"d4 Nf6 c3 d5 Bf4 e6",tag:{2:{n:"Queen's Pawn, 2.c3",p:"A slow London-style build."},5:{n:"2.c3, main setup",p:"Treat it as a London: ...c5, ...Nc6, ...Bd6, and ...Qb6 hitting b2."}}},{b:"b",mv:"d2d4 g8f6 f2f4 d7d5 g1f3 e7e6",san:"d4 Nf6 f4 d5 Nf3 e6",tag:{2:{n:"Stonewall Attack",p:"He builds a pawn wall on d4 and f4 and aims for a kingside attack."},5:{n:"Stonewall, main setup",p:"His e4 square is the hole. Aim a knight at e4 via ...Ne4 or ...Nbd7-f6, and break with ...c5."}}},{b:"b",mv:"g1f3 g8f6 g2g3 d7d5 f1g2 e7e6",san:"Nf3 Nf6 g3 d5 Bg2 e6",tag:{2:{n:"R\xE9ti, fianchetto",p:"The main R\xE9ti setup."},5:{n:"R\xE9ti fianchetto, main setup",p:"...Be7, castle, ...c5. If he plays c4 and d4 you are back in your Catalan."}}},{b:"b",mv:"g1f3 g8f6 d2d4 e7e6",san:"Nf3 Nf6 d4 e6",tag:{2:{n:"Transposing to 1.d4",p:"He has committed. You are in your Queen's Pawn book \u2014 carry on as normal."}}},{b:"b",mv:"g1f3 g8f6 b2b3 d7d5 c1b2 e7e6",san:"Nf3 Nf6 b3 d5 Bb2 e6",tag:{2:{n:"R\xE9ti, Nimzo-Larsen setup",p:"Double fianchetto ideas."},5:{n:"Nimzo-Larsen, main setup",p:"...c5 and ...Nc6 stake the centre. His b2 bishop bites on granite."}}},{b:"b",mv:"c2c4 g8f6 b2b3 e7e5 c1b2 b8c6 e2e3 d7d5 c4d5 f6d5 a2a3 f8d6 d1c2 e8g8",san:"c4 Nf6 b3 e5 Bb2 Nc6 e3 d5 cxd5 Nxd5 a3 Bd6 Qc2 O-O",tag:{2:{n:"English: 2.b3",p:"Double fianchetto ideas. He is playing a system and conceding the centre while he does it."},3:{n:"...e5! - take what he is giving",t:"main",p:"He has not put a pawn in the middle, so you do. Engine's first choice and the most direct punishment of a slow setup. Note this is one of the few places you deviate from ...e6 - here the centre is free, so take it."},13:{n:"2.b3, main line",p:"You have the full centre and easy development. His bishop on b2 stares at your e5 pawn all game and achieves nothing while you castle and play ...Re8, ...Bf5."}}},{b:"b",mv:"c2c4 g8f6 b2b3 d7d5 c4d5 d8d5 b1c3 d5f5 g2g3 e7e5 f1g2 b8c6 g1f3 f8b4",san:"c4 Nf6 b3 d5 cxd5 Qxd5 Nc3 Qf5 g3 e5 Bg2 Nc6 Nf3 Bb4",tag:{3:{n
